name: Release candidate

# Candidate promotion/fixes trigger an index round-trip; no GitHub Release is needed.
on:
  push:
    branches: [release_candidate]
  workflow_dispatch:

permissions:
  contents: read

# Finish an active upload rather than cancelling it midway. Stale heads fail authorization.
concurrency:
  group: testpypi-publication
  cancel-in-progress: false

jobs:
  authorize:
    name: RC / authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.runtimes.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
      - run: python .github/scripts/ci_policy.py candidate-head
      - name: Build the candidate matrix from the test manifests
        id: runtimes
        run: python .github/scripts/python_runtime_matrix.py discover
      - name: Retain the selected candidate runtime matrix
        uses: actions/upload-artifact@v7
        with:
          name: candidate-python-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/python-matrix.json
          if-no-files-found: error
          retention-days: 90

  source-qualification:
    needs: authorize
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/verify-source-qualification.yml

  build:
    needs: [authorize, source-qualification]
    uses: ./.github/workflows/build-distributions.yml
    with:
      artifact-name: candidate-dists-${{ github.run_id }}-${{ github.run_attempt }}

  publish:
    name: RC / publish-to-TestPyPI
    needs: [authorize, source-qualification, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypitest
      url: https://test.pypi.org/project/melder/
    permissions:
      contents: read
      # Trusted Publishing: this job's OIDC token is its only TestPyPI credential and signs each uploaded file's
      # PEP 740 attestation. No other job of this workflow holds it.
      id-token: write
    outputs:
      # The files this attempt staged and the attempt itself, for the provenance job: a failed-jobs re-run of a
      # later job keeps both from the attempt that uploaded, which is the attempt the attestations name.
      uploaded: ${{ steps.upload.outputs.uploaded }}
      attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
      - name: Retrieve this run's verified build
        # Named by the build job's output, so a failed-jobs re-run (after a TestPyPI outage, for example) reuses
        # this run's build instead of asking for one its own attempt never made. prepare-upload verifies the
        # files again before anything is uploaded.
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist/
      - name: Verify existing files and prepare an exact upload
        id: upload
        run: python .github/scripts/testpypi_candidate.py prepare-upload --report reports/upload.json
      - name: Recheck the candidate after environment admission
        run: python .github/scripts/ci_policy.py candidate-head
      - name: Publish missing verified files by Trusted Publishing, with attestations
        if: steps.upload.outputs.upload-required == 'true'
        # Pinned to its commit, as astral-sh/setup-uv is, because this step runs with the job's id-token. With no
        # user or password it authenticates as this workflow's TestPyPI Trusted Publisher (release-candidate.yml,
        # environment pypitest) and signs every file in upload/ with Sigstore.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: upload/
          attestations: true
          print-hash: true
      - name: Retain upload identity
        uses: actions/upload-artifact@v7
        with:
          name: candidate-upload-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/upload.json
          if-no-files-found: error
          retention-days: 90

  provenance:
    name: RC / provenance
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
      - name: Retrieve this run's verified build
        # The build the publish job verified and uploaded; the provenance check verifies the files again before
        # it trusts their digests.
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist/
      - name: Verify every candidate file's TestPyPI provenance before any probe installs it
        # Five layers per file: a provenance exists, its publisher is this workflow in pypitest, Sigstore verifies
        # it, the certificate names this repository, workflow, commit and run claim by claim, and the statement
        # names the file's sha256. The pinned verifier first proves itself on a recorded attestation.
        env:
          CANDIDATE_UPLOADED: ${{ needs.publish.outputs.uploaded }}
          CANDIDATE_PUBLISH_ATTEMPT: ${{ needs.publish.outputs.attempt }}
        run: python .github/scripts/testpypi_provenance.py verify --report reports/provenance.json
      - name: Retain provenance evidence
        uses: actions/upload-artifact@v7
        with:
          name: candidate-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/provenance.json
          if-no-files-found: error
          retention-days: 90

  install:
    name: RC / installed-package / ${{ matrix.os }} / Python ${{ matrix.python }} no-GIL
    needs: [authorize, build, publish, provenance]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.authorize.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
          freethreaded: true
          allow-prereleases: false
      - name: Retrieve this run's verified build
        # The same build the publish job verified and uploaded; probe-install pins the wheel's hash.
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist/
      - name: Download the hash-pinned wheel and test its isolated installation
        env:
          PYTHON_GIL: "0"
        run: python .github/scripts/testpypi_candidate.py probe-install --report reports/installed.json
      - name: Retain installed-package evidence
        uses: actions/upload-artifact@v7
        with:
          name: candidate-install-${{ matrix.os }}-python-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/installed.json
          if-no-files-found: error
          retention-days: 90

  package-ready:
    name: RC / package-ready
    needs: [authorize, source-qualification, build, publish, provenance, install]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
      - name: Require every candidate stage to have succeeded
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python .github/scripts/ci_policy.py candidate-ready
      - name: Refuse a superseded candidate
        run: python .github/scripts/ci_policy.py candidate-head
