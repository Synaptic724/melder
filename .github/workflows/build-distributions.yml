name: Build distributions

on:
  workflow_call:
    inputs:
      artifact-name:
        type: string
        required: true
      release-tag:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      artifact-name:
        description: Name for the verified distribution artifact
        type: string
        default: manual-distributions
      release-tag:
        description: Optional tag to compare with the package version
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Distributions / build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version-file: pyproject.toml
          freethreaded: true
          allow-prereleases: false
      - name: Set up uv for locked build tools
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: pyproject.toml
          resolution-strategy: lowest
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: build-${{ steps.python.outputs.python-version }}-${{ runner.arch }}
      - name: Install locked build tools
        run: uv sync --locked --only-group build --python "${{ steps.python.outputs.python-path }}"
      - name: Verify durable source assets
        run: uv run --no-sync python src/melder/_build_assets/_build_asset_runner.py --check
      - name: Set deterministic source timestamps for same-commit retries
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Build wheel and source distribution
        run: uv run --no-sync python -m build --no-isolation --sdist --wheel
      - name: Normalize source archive metadata for identical retries
        run: uv run --no-sync python .github/scripts/normalize_sdist.py
      - name: Verify archive boundaries and versions
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: uv run --no-sync python .github/scripts/verify_distributions.py --release-tag "$RELEASE_TAG"
      - name: Install and verify the wheel in isolation
        env:
          PYTHON_GIL: "0"
        run: |
          uv venv --python "${{ steps.python.outputs.python-path }}" "$RUNNER_TEMP/melder-wheel-probe"
          uv pip install --python "$RUNNER_TEMP/melder-wheel-probe/bin/python" --no-deps dist/*.whl
          "$RUNNER_TEMP/melder-wheel-probe/bin/python" -I .github/scripts/smoke_wheel.py
      - name: Retain verified distributions
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
