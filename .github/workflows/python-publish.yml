name: Publish Python Package

# Release events must reach this workflow on the default branch. The runtime tests do
# not run again here: full CI and the release candidate tested this exact tree, and
# release-gate refuses any other. Hygiene, both asset checks and the build run fresh.
on:
  release:
    types: [published]
  workflow_dispatch:

# Serialize manual and release-event publication across every tag/ref.
concurrency:
  group: pypi-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-gate:
    name: Require current prod HEAD
    # Publishing an RC on GitHub must not publish a final package automatically.
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
      - name: Authorize the selected final release
        run: python .github/scripts/ci_policy.py release-head
      - name: Require successful TestPyPI qualification of the candidate source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/check_candidate_run.py

  hygiene:
    name: Release / repository-hygiene
    needs: release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
      - run: python .github/scripts/ci_policy.py hygiene

  source-assets:
    needs: release-gate
    uses: ./.github/workflows/build-src-assets.yml

  repo-assets:
    needs: release-gate
    uses: ./.github/workflows/build-repo-assets.yml

  release-build:
    needs: [release-gate, hygiene, source-assets, repo-assets]
    uses: ./.github/workflows/build-distributions.yml
    with:
      artifact-name: release-dists-${{ github.run_id }}-${{ github.run_attempt }}
      release-tag: ${{ github.event.release.tag_name || '' }}

  pypi-publish:
    name: Publish to PyPI
    needs: [release-gate, hygiene, source-assets, repo-assets, release-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      # Trusted Publishing: this job's OIDC token is its only PyPI credential and signs each uploaded file's PEP 740
      # attestation. No other job of this workflow holds it.
      id-token: write
    outputs:
      # The attempt that uploaded, for the provenance job: a failed-jobs re-run of that job alone keeps this output
      # from the upload's attempt, which is the attempt the attestations name.
      attempt: ${{ github.run_attempt }}
    environment:
      # PyPI's Trusted Publisher for this workflow names this environment, and the job's OIDC token carries it.
      name: pypi
      url: https://pypi.org/project/melder/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
      - name: Refuse a failed-jobs re-run of the upload
        # Publication never reuses an earlier attempt's build: a failed-jobs re-run does not repeat release-build,
        # whose output then still names that attempt's artifact. Recover with "Re-run all jobs".
        env:
          BUILT_ARTIFACT: ${{ needs.release-build.outputs.artifact-name }}
          EXPECTED_ARTIFACT: release-dists-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ "$BUILT_ARTIFACT" != "$EXPECTED_ARTIFACT" ]; then
            echo "::error::Use Re-run all jobs: this attempt did not build the distributions ($BUILT_ARTIFACT)."
            exit 1
          fi
      - name: Retrieve this run's verified distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
      - name: Recheck distribution and tag identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
        run: python .github/scripts/verify_distributions.py --release-tag "$RELEASE_TAG"
      - name: Recheck exact-source candidate qualification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/check_candidate_run.py
      - name: Final tag and prod check immediately before publication
        # This runs AFTER environment approval and fails if the release tag or
        # prod moved while checks, builds, or a human approval were pending.
        run: python .github/scripts/ci_policy.py release-head
      - name: Publish freshly verified distributions to PyPI by Trusted Publishing, with attestations
        # Pinned to its commit, as in release-candidate.yml, because this step runs with the job's id-token. With no
        # user or password it authenticates as this workflow's PyPI Trusted Publisher (python-publish.yml,
        # environment pypi) and signs every file in dist/ with Sigstore.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true
          print-hash: true

  pypi-provenance:
    name: Release / provenance
    needs: [release-build, pypi-publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
      - name: Retrieve this run's verified distributions
        # The build pypi-publish verified and uploaded, named by release-build's output so a failed-jobs re-run of
        # this job alone reads the same files; the check verifies them again before it trusts their digests.
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.release-build.outputs.artifact-name }}
          path: dist/
      - name: Verify every released file's PyPI provenance
        # Five layers per file: a provenance exists, its publisher is this workflow in pypi, Sigstore verifies it,
        # the certificate names this repository, workflow, ref, commit and upload attempt claim by claim, and the
        # statement names the file's sha256. The pinned verifier first proves itself on a recorded attestation.
        # The files are already on PyPI: a refusal fails this run before the release is announced.
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
          RELEASE_PUBLISH_ATTEMPT: ${{ needs.pypi-publish.outputs.attempt }}
        run: python .github/scripts/pypi_provenance.py verify --report reports/provenance.json
      - name: Retain provenance evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/provenance.json
          if-no-files-found: error
          retention-days: 90
