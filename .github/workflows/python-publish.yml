name: Publish Python Package

# Release events must reach this workflow on the default branch. Earlier PR CI
# never substitutes for this fresh release-time test/build qualification.
on:
  release:
    types: [published]
  workflow_dispatch:

# Serialize manual and release-event publication across every tag/ref.
concurrency:
  group: pypi-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-gate:
    name: Require current prod HEAD
    # Publishing an RC on GitHub must not publish a final package automatically.
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Authorize the selected final release
        run: python .github/scripts/ci_policy.py release-head

  hygiene:
    name: Release / repository-hygiene
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python .github/scripts/ci_policy.py hygiene

  source-assets:
    needs: release-gate
    uses: ./.github/workflows/build-src-assets.yml

  repo-assets:
    needs: release-gate
    uses: ./.github/workflows/build-repo-assets.yml

  tests:
    needs: release-gate
    uses: ./.github/workflows/test-runtime.yml

  release-build:
    needs: [release-gate, hygiene, source-assets, repo-assets, tests]
    uses: ./.github/workflows/build-distributions.yml
    with:
      artifact-name: release-dists-${{ github.run_id }}-${{ github.run_attempt }}
      release-tag: ${{ github.event.release.tag_name || '' }}

  pypi-publish:
    name: Publish to PyPI
    needs: [release-gate, hygiene, source-assets, repo-assets, tests, release-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      # Only this job receives the environment-scoped PYPI_API_TOKEN.
      name: pypi
      url: https://pypi.org/project/melder/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Retrieve this run's verified distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
      - name: Recheck distribution and tag identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
        run: python .github/scripts/verify_distributions.py --release-tag "$RELEASE_TAG"
      - name: Final prod check immediately before publication
        # This runs AFTER environment approval and fails if prod moved while
        # tests, builds, or a human approval were pending.
        run: python .github/scripts/ci_policy.py release-head
      - name: Publish freshly verified distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          attestations: false
          print-hash: true
