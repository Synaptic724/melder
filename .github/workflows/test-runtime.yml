name: Runtime tests

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        description: Optional repository upload token; reporting is skipped when absent.
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Runtime / discover stable no-GIL versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.runtimes.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml
          allow-prereleases: false
      - name: Discover every supported stable minor
        id: runtimes
        run: python .github/scripts/python_runtime_matrix.py discover
      - name: Retain the selected runtime matrix
        uses: actions/upload-artifact@v7
        with:
          name: runtime-python-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/python-matrix.json
          if-no-files-found: error
          retention-days: 90

  test:
    name: Runtime / ${{ matrix.os }} / Python ${{ matrix.python }} no-GIL
    needs: discover
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      COVERAGE_ARTIFACT: coverage-${{ matrix.os }}-python-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
          freethreaded: true
          allow-prereleases: false
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Melder and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test
          python -m pip install --no-deps --editable .
      - name: Run supported test tiers with runtime verification
        env:
          # Fix pytest's posture, including plugins, without affecting macOS setup helpers.
          PYTHON_GIL: "0"
        run: >-
          python .github/scripts/run_runtime_tests.py --report reports/runtime.xml
          --coverage-report reports/${{ env.COVERAGE_ARTIFACT }}.xml
      - name: Retain coverage report
        # Only successful runtime executions may supply reusable coverage reports.
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.COVERAGE_ARTIFACT }}
          path: reports/${{ env.COVERAGE_ARTIFACT }}.xml
          archive: true
          if-no-files-found: warn
          retention-days: 14
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-results-${{ matrix.os }}-python-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/runtime.xml
          if-no-files-found: warn
          retention-days: 14

  coverage:
    name: Coverage / Codecov
    needs: [discover, test]
    permissions:
      contents: read
      actions: read
    # Forks still run tests and retain XML, but never receive upload credentials.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reporting availability must not turn passing tests into a release failure.
    continue-on-error: true
    steps:
      - name: Check Codecov token
        id: credentials
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Add repository Actions secret CODECOV_TOKEN to enable coverage uploads."
          fi
      - uses: actions/checkout@v7
        if: steps.credentials.outputs.enabled == 'true'
      - uses: actions/setup-python@v7
        if: steps.credentials.outputs.enabled == 'true'
        with:
          python-version-file: pyproject.toml
          allow-prereleases: false
      - name: Download this run's coverage reports
        if: steps.credentials.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          # Partial reruns reuse successful cells from earlier attempts of this run.
          pattern: coverage-*-${{ github.run_id }}-*
          path: coverage-reports
          # XML payload names already carry OS/version/run/attempt, so merging is lossless.
          merge-multiple: true
      - name: Require the complete coverage matrix
        if: steps.credentials.outputs.enabled == 'true'
        env:
          CI_PYTHON_MATRIX: ${{ needs.discover.outputs.matrix }}
        run: python .github/scripts/python_runtime_matrix.py coverage
      - name: Retain coverage selection provenance
        if: steps.credentials.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: selected-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/coverage-selection.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload coverage to Codecov
        if: steps.credentials.outputs.enabled == 'true'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: selected-coverage
          fail_ci_if_error: true
          # Final-release tags have already been verified against current prod.
          override_branch: ${{ github.event_name == 'release' && 'prod' || '' }}
