name: Documentation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    name: Docs / site and handbook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: docs/requirements.lock
      - name: Install the locked documentation environment
        run: python -m pip install -r docs/requirements.txt
      - name: Check publication contracts
        run: |
          python -m unittest discover -s docs/tests -q
          python docs/tools/build_docs.py check
      - name: Build the complete site
        run: python docs/tools/build_docs.py build
      - name: Validate links, anchors, and canonical source downloads
        run: python docs/tools/check_site.py
      - name: Build the ePub handbook
        run: python docs/tools/build_docs.py handbook --builder epub
      - name: Install the verified PDF compiler
        run: python docs/tools/install_tectonic.py
      - name: Build the PDF handbook
        run: python docs/tools/build_docs.py handbook --builder pdf --tectonic docs/_build/tools/tectonic/tectonic
      - name: Archive the complete HTML site
        run: python docs/tools/build_docs.py archive
      - name: Retain the rendered documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/_build/html/
            docs/_build/htmlzip/*.zip
            docs/_build/handbook-epub/*.epub
            docs/_build/handbook-pdf/*.pdf
          if-no-files-found: error
          retention-days: 14
