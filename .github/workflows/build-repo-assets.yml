name: build-repo-assets

# Repository bundles are committed truth for external LLM tools. CI verifies
# them without bot write-back. Its mandatory gate cannot be disabled with
# BUILD_REPO_ASSETS_GATE; the former switch is retired.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-assets-current:
    name: Repository assets / verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: List repository asset inputs
        run: python llm_support/_builder.py --list
      - name: Verify committed repository assets
        run: python llm_support/_builder.py --check
      - name: Explain failure
        if: failure()
        run: |
          echo "::error::Committed repository assets are stale or invalid."
          echo "Regenerate locally, then commit the result:"
          echo "    python llm_support/_builder.py"
