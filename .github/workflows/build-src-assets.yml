name: build-src-assets

# Committed runtime manifests are authoritative and must match their builders.
# CI owns push/PR triggering and calls this workflow for every required gate.
# The former BUILD_SRC_ASSETS_GATE kill switch is retired: a required validation
# must never turn into a successful skipped job. Manual checks remain available.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Concurrency belongs to the caller. A helper must not cancel a publication run
# or another caller checking the same ref.
jobs:
  assets-current:
    name: Source assets / verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Builders parse source without importing the Melder runtime.
          python-version: "3.14"
      - name: List discovered build assets
        run: python src/melder/_build_assets/_build_asset_runner.py --list
      - name: Verify committed source assets
        run: python src/melder/_build_assets/_build_asset_runner.py --check
      - name: Explain failure
        if: failure()
        run: |
          echo "::error::A committed source asset is stale or invalid."
          echo "Regenerate locally, then commit the result:"
          echo "    python src/melder/_build_assets/_build_asset_runner.py"
