name: build-src-assets

# WHY THIS GATE EXISTS
# --------------------
# melder's durable build assets are generated, committed, and imported at module
# scope by the runtime. The bind-guard manifest in particular IS the enforced
# registration policy - `bind.py` reads it directly and there is no runtime
# rebuild lane, so a stale committed manifest silently enforces a class list that
# no longer matches the source. That has already happened in this repo: a
# manifest generated before a class was added went unregenerated and drifted
# unnoticed.
#
# This job is the only thing standing between that and a released wheel.
#
#
# KILL SWITCH
# -----------
# Set the repository variable BUILD_SRC_ASSETS_GATE to `off` to stop this gate
# running on push and pull_request:
#
#     Settings -> Secrets and variables -> Actions -> Variables tab
#     New repository variable:  BUILD_SRC_ASSETS_GATE = off
#
# Or from the CLI, no commit and no file edit either way:
#
#     gh variable set BUILD_SRC_ASSETS_GATE --body off      # disable
#     gh variable set BUILD_SRC_ASSETS_GATE --body on       # re-enable
#     gh variable delete BUILD_SRC_ASSETS_GATE              # re-enable (unset)
#
# Two deliberate choices about how the switch behaves:
#
#   DEFAULT IS ON. The test is `!= 'off'`, not `== 'on'`, so an unset or
#   misspelled variable leaves the gate RUNNING. A safety check whose default
#   state is "silently absent" is worse than no check at all - a fresh clone, a
#   fork, or a typo would disable the one thing protecting the registration
#   policy, and nothing would say so.
#
#   MANUAL RUNS IGNORE IT. `workflow_dispatch` always executes, so the gate is
#   still available on demand while it is switched off for routine pushes.
#
# The `gate-status` job below runs unconditionally and is loud when the switch is
# off, so a gate disabled during a working session cannot quietly stay disabled.
# It costs a few seconds. Delete it if you find it noisy - it is a guardrail on
# the guardrail, not part of the check.
#
# To silence this workflow entirely without touching either, use the Actions tab
# -> build-src-assets -> "..." -> Disable workflow. That is GitHub-side state, so it
# leaves no trace in the repo, which cuts both ways.

on:
  push:
    branches: ["**"]
    # Only source changes can move a manifest. Docs, tickets and context_compass
    # edits cannot, so they no longer trigger a ~2 minute tree hash. This is the
    # cheap half of "stop running all the time" - it needs no switch and cannot
    # leave the gate off by accident.
    paths:
      - "src/melder/**/*.py"
      - ".github/workflows/build-src-assets.yml"
  pull_request:
    paths:
      - "src/melder/**/*.py"
      - ".github/workflows/build-src-assets.yml"
  workflow_dispatch:

# A push to a branch that already has an open PR fires this twice. Cancelling
# superseded runs per ref keeps the newest one and drops the rest.
concurrency:
  group: build-src-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-status:
    name: gate status
    runs-on: ubuntu-latest
    steps:
      - name: Report whether the gate is armed
        # Passed through `env` rather than interpolated straight into the script:
        # a `${{ }}` substitution inside `run:` is pasted in as raw shell text, so
        # a variable value containing shell metacharacters would execute.
        env:
          GATE: ${{ vars.BUILD_SRC_ASSETS_GATE }}
        run: |
          # Lowercased on purpose. GitHub Actions `!=` on strings is CASE
          # INSENSITIVE, so `OFF` and `Off` disable the job below. A
          # case-sensitive test here would then report "armed" while the gate
          # was actually off - the one lie this job exists to prevent.
          if [ "${GATE,,}" = "off" ]; then
            echo "::warning title=Build-asset gate is DISABLED::BUILD_SRC_ASSETS_GATE=${GATE} - committed manifests are NOT being verified. Re-arm with: gh variable delete BUILD_SRC_ASSETS_GATE"
          else
            echo "Build-asset gate is armed."
          fi

  assets-current:
    name: durable build assets are current
    # Runs unless explicitly switched off; manual dispatch always runs.
    if: vars.BUILD_SRC_ASSETS_GATE != 'off' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # The runner never imports melder - it loads builders by file path and
          # parses source with `ast` - so it does not need the 3.14t free-threaded
          # build the runtime itself requires.
          python-version: "3.14"

      - name: List discovered build assets
        run: python src/melder/_build_assets/_build_asset_runner.py --list

      - name: Verify every manifest matches its builder
        run: python src/melder/_build_assets/_build_asset_runner.py --check

      - name: Explain failure
        if: failure()
        run: |
          echo "::error::A committed build asset is stale or hand-edited."
          echo "Regenerate locally and commit the result:"
          echo "    python src/melder/_build_assets/_build_asset_runner.py"
