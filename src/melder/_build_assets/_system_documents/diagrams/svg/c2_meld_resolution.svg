<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="1040"
     viewBox="0 0 1600 1040"
     role="img"
     aria-labelledby="c2-title c2-desc">
  <title id="c2-title">Melder C2 meld resolution</title>
  <desc id="c2-desc">
    A caller enters Conduit meld through a CreationGate. Meld resolves the target,
    checks lineage validity and dirty roots, lazily reruns structural and resolution
    phases when needed, executes a compiled CreationContext, and routes storage by
    Existence before returning a scoped instance.
  </desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6"
            orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#40536d"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6"
            orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#315a99"/>
    </marker>
    <style>
      .canvas { fill: #f8fafc; }
      .title { font: 700 34px "Segoe UI", Arial, sans-serif; fill: #10213d; }
      .subtitle { font: 400 18px "Segoe UI", Arial, sans-serif; fill: #52627a; }
      .eyebrow { font: 700 14px "Segoe UI", Arial, sans-serif; letter-spacing: 1.6px; fill: #315a99; }
      .boundary { fill: #ffffff; stroke: #315a99; stroke-width: 3; }
      .boundary-title { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #23344d; }
      .caller { fill: #fff3d6; stroke: #9a6700; stroke-width: 2.5; }
      .execution { fill: #eaf7ef; stroke: #3f7a56; stroke-width: 2.5; }
      .governance { fill: #f4eaff; stroke: #7552a3; stroke-width: 2.5; }
      .definition { fill: #e8f0ff; stroke: #315a99; stroke-width: 2.5; }
      .storage { fill: #fff0e8; stroke: #a4552a; stroke-width: 2.5; }
      .failure { fill: #fff1f2; stroke: #b23b4a; stroke-width: 2.5; }
      .node-title { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #172033; }
      .node-body { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #42526a; }
      .node-small { font: 600 12px "Segoe UI", Arial, sans-serif; fill: #52627a; }
      .edge { fill: none; stroke: #40536d; stroke-width: 3; marker-end: url(#arrow); }
      .edge-blue { fill: none; stroke: #315a99; stroke-width: 3.5; marker-end: url(#arrow-blue); }
      .edge-dashed { fill: none; stroke: #665a70; stroke-width: 2.7; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .merge { fill: none; stroke: #a4552a; stroke-width: 3; }
      .label-bg { fill: #ffffff; opacity: 0.96; }
      .edge-label { font: 600 12px "Segoe UI", Arial, sans-serif; fill: #34445b; }
      .lane-label { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #52627a; letter-spacing: 0.5px; }
      .depth-line { stroke: #cbd5e1; stroke-width: 3; }
      .depth-active { fill: #315a99; }
      .depth-idle { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
      .depth-text { font: 700 14px "Segoe UI", Arial, sans-serif; fill: #ffffff; }
      .depth-idle-text { font: 700 14px "Segoe UI", Arial, sans-serif; fill: #52627a; }
      .footer { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1600" height="1040"/>
  <text class="eyebrow" x="70" y="58">SYSTEM DOCUMENTS · C2</text>
  <text class="title" x="70" y="104">Inside one meld resolution</text>
  <text class="subtitle" x="70" y="137">
    Admission, target lookup, validation, lazy recompilation, compiled execution, and lifetime routing.
  </text>

  <line class="depth-line" x1="1262" y1="82" x2="1482" y2="82"/>
  <circle class="depth-idle" cx="1262" cy="82" r="25"/>
  <circle class="depth-idle" cx="1372" cy="82" r="25"/>
  <circle class="depth-active" cx="1482" cy="82" r="25"/>
  <text class="depth-idle-text" x="1262" y="87" text-anchor="middle">C4</text>
  <text class="depth-idle-text" x="1372" y="87" text-anchor="middle">C3</text>
  <text class="depth-text" x="1482" y="87" text-anchor="middle">C2</text>

  <rect class="boundary" x="210" y="182" width="1320" height="742" rx="26"/>
  <rect x="244" y="166" width="326" height="34" rx="8" fill="#ffffff"/>
  <text class="boundary-title" x="260" y="190">Conduit.meld execution path</text>

  <rect class="caller" x="34" y="354" width="150" height="150" rx="20" filter="url(#shadow)"/>
  <circle cx="109" cy="392" r="19" fill="#ffffff" stroke="#9a6700" stroke-width="2"/>
  <path d="M 77 454 Q 109 414 141 454" fill="#ffffff" stroke="#9a6700" stroke-width="2"/>
  <text class="node-title" x="109" y="480" text-anchor="middle">Caller</text>

  <text class="lane-label" x="260" y="254">PRIMARY EXECUTION LANE</text>

  <rect class="execution" x="260" y="300" width="210" height="138" rx="16" filter="url(#shadow)"/>
  <text class="node-title" x="365" y="336" text-anchor="middle">Conduit front door</text>
  <text class="node-body" x="365" y="365" text-anchor="middle">CreationGate ticket</text>
  <text class="node-body" x="365" y="389" text-anchor="middle">pre-resolve hook</text>
  <rect x="301" y="405" width="128" height="22" rx="11" fill="#ffffff" stroke="#81b994"/>
  <text class="node-small" x="365" y="421" text-anchor="middle">caller scope</text>

  <rect class="execution" x="520" y="300" width="205" height="138" rx="16" filter="url(#shadow)"/>
  <text class="node-title" x="622" y="336" text-anchor="middle">Target resolver</text>
  <text class="node-body" x="622" y="365" text-anchor="middle">spell id or normalized key</text>
  <text class="node-body" x="622" y="389" text-anchor="middle">input overrides normalized</text>
  <rect x="558" y="405" width="128" height="22" rx="11" fill="#ffffff" stroke="#81b994"/>
  <text class="node-small" x="622" y="421" text-anchor="middle">resolved Spell</text>

  <rect class="governance" x="775" y="286" width="220" height="166" rx="18" filter="url(#shadow)"/>
  <path d="M 807 322 h24 l10 13 -10 13 h-24 l-10-13 z" fill="#ffffff" stroke="#7552a3" stroke-width="2"/>
  <text class="node-title" x="900" y="326" text-anchor="middle">Runtime gates</text>
  <text class="node-body" x="885" y="363" text-anchor="middle">lineage valid?</text>
  <text class="node-body" x="885" y="389" text-anchor="middle">resolution valid?</text>
  <text class="node-body" x="885" y="415" text-anchor="middle">root clean?</text>
  <rect x="826" y="427" width="118" height="18" rx="9" fill="#ffffff" stroke="#b899d7"/>
  <text class="node-small" x="885" y="441" text-anchor="middle">fail before execution</text>

  <rect class="execution" x="1045" y="300" width="210" height="138" rx="16" filter="url(#shadow)"/>
  <text class="node-title" x="1150" y="336" text-anchor="middle">CreationContext</text>
  <text class="node-body" x="1150" y="365" text-anchor="middle">compiled executor lane</text>
  <text class="node-body" x="1150" y="389" text-anchor="middle">hooks + overrides</text>
  <rect x="1086" y="405" width="128" height="22" rx="11" fill="#ffffff" stroke="#81b994"/>
  <text class="node-small" x="1150" y="421" text-anchor="middle">construct or reuse</text>

  <path class="storage" d="M 1334 296 h116 l50 73 -50 73 h-116 l-50-73 z" filter="url(#shadow)"/>
  <text class="node-title" x="1392" y="353" text-anchor="middle">Existence</text>
  <text class="node-title" x="1392" y="377" text-anchor="middle">router</text>
  <text class="node-small" x="1392" y="409" text-anchor="middle">who owns the instance?</text>

  <path class="edge-blue" d="M 184 412 H 260"/>
  <rect class="label-bg" x="186" y="378" width="72" height="22" rx="5"/>
  <text class="edge-label" x="222" y="394" text-anchor="middle">meld(...)</text>

  <path class="edge" d="M 470 369 H 520"/>
  <path class="edge" d="M 725 369 H 775"/>
  <path class="edge" d="M 995 369 H 1045"/>
  <path class="edge" d="M 1255 369 H 1284"/>

  <rect class="label-bg" x="724" y="336" width="50" height="22" rx="5"/>
  <text class="edge-label" x="749" y="352" text-anchor="middle">Spell</text>
  <rect class="label-bg" x="996" y="336" width="48" height="22" rx="5"/>
  <text class="edge-label" x="1020" y="352" text-anchor="middle">clean</text>

  <text class="lane-label" x="260" y="518">GOVERNANCE + LAZY REVALIDATION</text>

  <rect class="governance" x="260" y="552" width="210" height="88" rx="14"/>
  <text class="node-title" x="365" y="582" text-anchor="middle">SpellSystemStates</text>
  <text class="node-body" x="365" y="608" text-anchor="middle">lineage + conduit validity</text>
  <text class="node-small" x="365" y="629" text-anchor="middle">frame-local registry</text>

  <rect class="governance" x="500" y="552" width="210" height="88" rx="14"/>
  <text class="node-title" x="605" y="582" text-anchor="middle">ChangeControl</text>
  <text class="node-body" x="605" y="608" text-anchor="middle">dirty roots + pending change</text>
  <text class="node-small" x="605" y="629" text-anchor="middle">per-conduit truth</text>

  <rect class="definition" x="742" y="552" width="190" height="88" rx="14"/>
  <text class="node-title" x="837" y="582" text-anchor="middle">Phases 1–4</text>
  <text class="node-body" x="837" y="608" text-anchor="middle">structural revalidation</text>
  <text class="node-small" x="837" y="629" text-anchor="middle">under spell lock</text>

  <rect class="definition" x="962" y="552" width="190" height="88" rx="14"/>
  <text class="node-title" x="1057" y="582" text-anchor="middle">Phases 5–11</text>
  <text class="node-body" x="1057" y="608" text-anchor="middle">resolution revalidation</text>
  <text class="node-small" x="1057" y="629" text-anchor="middle">for target conduit</text>

  <rect class="failure" x="1200" y="552" width="250" height="88" rx="14"/>
  <text class="node-title" x="1325" y="582" text-anchor="middle">Typed refusal</text>
  <text class="node-body" x="1325" y="608" text-anchor="middle">validation · dirty root · scope</text>
  <text class="node-small" x="1325" y="629" text-anchor="middle">no instance is created</text>

  <path class="edge-dashed" d="M 470 596 H 735 V 452 H 820"/>
  <path class="edge-dashed" d="M 710 596 H 724 V 466 H 850"/>
  <path class="edge-dashed" d="M 885 452 V 522 H 837 V 552"/>
  <path class="edge" d="M 932 596 H 962"/>
  <path class="edge-dashed" d="M 1057 552 V 492 H 930 V 452"/>
  <path class="edge-dashed" d="M 952 452 V 500 H 1325 V 552"/>

  <rect class="label-bg" x="748" y="484" width="104" height="22" rx="5"/>
  <text class="edge-label" x="800" y="500" text-anchor="middle">unknown / gated</text>
  <rect class="label-bg" x="1147" y="486" width="92" height="22" rx="5"/>
  <text class="edge-label" x="1193" y="502" text-anchor="middle">invalid / dirty</text>

  <text class="lane-label" x="260" y="700">LIFETIME OWNERSHIP</text>

  <rect class="storage" x="748" y="728" width="220" height="112" rx="16" filter="url(#shadow)"/>
  <text class="node-title" x="858" y="761" text-anchor="middle">Owner Creations</text>
  <text class="node-body" x="858" y="789" text-anchor="middle">unique · lineage · cluster</text>
  <text class="node-small" x="858" y="817" text-anchor="middle">shared owner controls teardown</text>

  <rect class="storage" x="1000" y="728" width="220" height="112" rx="16" filter="url(#shadow)"/>
  <text class="node-title" x="1110" y="761" text-anchor="middle">ConduitCreations</text>
  <text class="node-body" x="1110" y="789" text-anchor="middle">per-conduit · many</text>
  <text class="node-small" x="1110" y="817" text-anchor="middle">caller scope controls teardown</text>

  <rect class="storage" x="1252" y="728" width="220" height="112" rx="16" filter="url(#shadow)"/>
  <text class="node-title" x="1362" y="761" text-anchor="middle">SpellSpace</text>
  <text class="node-body" x="1362" y="789" text-anchor="middle">request-local Creations</text>
  <text class="node-small" x="1362" y="817" text-anchor="middle">active thread-local scope only</text>

  <path class="edge" d="M 1392 442 V 680 H 858 V 728"/>
  <path class="edge" d="M 1392 442 V 680 H 1110 V 728"/>
  <path class="edge" d="M 1392 442 V 680 H 1362 V 728"/>
  <rect class="label-bg" x="1160" y="656" width="88" height="22" rx="5"/>
  <text class="edge-label" x="1204" y="672" text-anchor="middle">route by scope</text>

  <path class="merge" d="M 858 840 V 872 H 1110"/>
  <path class="merge" d="M 1110 840 V 872"/>
  <path class="merge" d="M 1362 840 V 872 H 1110"/>

  <rect class="execution" x="440" y="842" width="240" height="70" rx="15" filter="url(#shadow)"/>
  <text class="node-title" x="560" y="872" text-anchor="middle">Resolved instance</text>
  <text class="node-body" x="560" y="896" text-anchor="middle">post-resolve hook</text>
  <path class="edge-blue" d="M 1110 872 H 680"/>
  <path class="edge-blue" d="M 440 876 H 196 V 470 H 184"/>
  <rect class="label-bg" x="298" y="844" width="98" height="22" rx="5"/>
  <text class="edge-label" x="347" y="860" text-anchor="middle">scoped object</text>

  <text class="footer" x="70" y="990">
    Dashed paths are governance, revalidation, and refusal. Solid paths are the successful execution lane.
  </text>
  <text class="footer" x="1530" y="990" text-anchor="end">
    Authored static view · source changes do not regenerate this drawing
  </text>
</svg>
