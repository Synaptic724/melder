<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="boot-title boot-desc">
  <title id="boot-title">Melder boot and ownership lifecycle</title>
  <desc id="boot-desc">Import creates Aether and hosted roots without a frame. The first Spellbook lazily establishes a named frame and conjures one root Conduit. Ownership narrows into execution services, lesser conduits, spell spaces, and resolved objects. Teardown stops work, drains tickets, cleans narrow scopes, disposes objects in reverse creation order, and releases loggers last.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#172033" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L12 6 L0 12z" fill="#40536d"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L12 6 L0 12z" fill="#a4552a"/></marker>
    <style>
      .canvas{fill:#f8fafc}.title{font:700 34px "Segoe UI",Arial,sans-serif;fill:#10213d}.subtitle{font:400 18px "Segoe UI",Arial,sans-serif;fill:#52627a}.eyebrow{font:700 14px "Segoe UI",Arial,sans-serif;letter-spacing:1.6px;fill:#315a99}
      .panel{fill:#fff;stroke:#7c9ac8;stroke-width:2.5}.cleanup-panel{fill:#fff9f5;stroke:#b56b42;stroke-width:2.5}.panel-title{font:700 18px "Segoe UI",Arial,sans-serif;fill:#23344d}.owner{fill:#e8f0ff;stroke:#315a99;stroke-width:2.5}.execution{fill:#eaf7ef;stroke:#3f7a56;stroke-width:2.5}.scope{fill:#e7f7fa;stroke:#287a88;stroke-width:2.5}.host{fill:#fff3d6;stroke:#9a6700;stroke-width:2.5}.cleanup{fill:#fff0e8;stroke:#a4552a;stroke-width:2.3}
      .node-title{font:700 16px "Segoe UI",Arial,sans-serif;fill:#172033}.node-body{font:400 13px "Segoe UI",Arial,sans-serif;fill:#42526a}.edge{fill:none;stroke:#40536d;stroke-width:2.8;marker-end:url(#arrow)}.edge-dashed{fill:none;stroke:#64748b;stroke-width:2.3;stroke-dasharray:8 6;marker-end:url(#arrow)}.cleanup-edge{fill:none;stroke:#a4552a;stroke-width:2.6;marker-end:url(#arrow-red)}.label{font:600 12px "Segoe UI",Arial,sans-serif;fill:#34445b}.number{fill:#a4552a}.number-text{font:700 12px "Segoe UI",Arial,sans-serif;fill:#fff}.footer{font:400 13px "Segoe UI",Arial,sans-serif;fill:#64748b}
    </style>
  </defs>
  <rect class="canvas" width="1600" height="1080"/>
  <text class="eyebrow" x="70" y="58">ENGINEERING DRAWINGS · LIFECYCLE</text>
  <text class="title" x="70" y="104">Boot establishes owners; teardown unwinds them in reverse</text>
  <text class="subtitle" x="70" y="137">Import creates the process substrate, while frames and object scopes appear only when application work asks for them.</text>

  <rect class="panel" x="70" y="180" width="1460" height="270" rx="24"/><rect x="104" y="164" width="282" height="34" rx="8" fill="#fff"/><text class="panel-title" x="120" y="188">Boot · establish one object world</text>
  <rect class="host" x="110" y="255" width="190" height="105" rx="16" filter="url(#shadow)"/><text class="node-title" x="205" y="291" text-anchor="middle">import melder</text><text class="node-body" x="205" y="320" text-anchor="middle">package-root views + Aether</text><text class="node-body" x="205" y="343" text-anchor="middle">zero frames</text>
  <rect class="owner" x="365" y="255" width="205" height="105" rx="16" filter="url(#shadow)"/><text class="node-title" x="468" y="291" text-anchor="middle">Aether</text><text class="node-body" x="468" y="320" text-anchor="middle">one process owner</text><text class="node-body" x="468" y="343" text-anchor="middle">hosts shared roots</text>
  <rect class="owner" x="635" y="255" width="220" height="105" rx="16" filter="url(#shadow)"/><text class="node-title" x="745" y="291" text-anchor="middle">First Spellbook</text><text class="node-body" x="745" y="320" text-anchor="middle">bind definitions</text><text class="node-body" x="745" y="343" text-anchor="middle">request named frame</text>
  <rect class="owner" x="920" y="255" width="220" height="105" rx="16" filter="url(#shadow)"/><text class="node-title" x="1030" y="291" text-anchor="middle">AethericFrame</text><text class="node-body" x="1030" y="320" text-anchor="middle">lazy named world</text><text class="node-body" x="1030" y="343" text-anchor="middle">posture before books</text>
  <rect class="execution" x="1205" y="255" width="260" height="105" rx="16" filter="url(#shadow)"/><text class="node-title" x="1335" y="291" text-anchor="middle">Root Conduit</text><text class="node-body" x="1335" y="320" text-anchor="middle">one conjure per Spellbook</text><text class="node-body" x="1335" y="343" text-anchor="middle">runtime scope becomes live</text>
  <path class="edge" d="M300 307 H365"/><path class="edge" d="M570 307 H635"/><path class="edge" d="M855 307 H920"/><path class="edge" d="M1140 307 H1205"/>
  <text class="label" x="887" y="290" text-anchor="middle">ensure frame</text><text class="label" x="1172" y="290" text-anchor="middle">conjure</text>

  <rect class="panel" x="70" y="520" width="900" height="430" rx="24"/><rect x="104" y="504" width="260" height="34" rx="8" fill="#fff"/><text class="panel-title" x="120" y="528">Ownership · broad to narrow</text>
  <rect class="owner" x="380" y="570" width="280" height="70" rx="15"/><text class="node-title" x="520" y="598" text-anchor="middle">Aether</text><text class="node-body" x="520" y="622" text-anchor="middle">frames + hosted roots</text>
  <rect class="owner" x="130" y="690" width="250" height="88" rx="15"/><text class="node-title" x="255" y="721" text-anchor="middle">Hosted roots</text><text class="node-body" x="255" y="747" text-anchor="middle">utilities · load · Nexus</text><text class="node-body" x="255" y="768" text-anchor="middle">Crystallizer · research</text>
  <rect class="owner" x="455" y="690" width="250" height="88" rx="15"/><text class="node-title" x="580" y="721" text-anchor="middle">AethericFrame</text><text class="node-body" x="580" y="747" text-anchor="middle">registries + DevOps</text><text class="node-body" x="580" y="768" text-anchor="middle">normal Conduits</text>
  <rect class="execution" x="725" y="690" width="230" height="88" rx="15"/><text class="node-title" x="840" y="721" text-anchor="middle">Conduit</text><text class="node-body" x="840" y="747" text-anchor="middle">Meld · CreationGate</text><text class="node-body" x="840" y="768" text-anchor="middle">ConduitWard · ConduitCreations</text>
  <rect class="scope" x="425" y="845" width="250" height="70" rx="15"/><text class="node-title" x="550" y="873" text-anchor="middle">Narrow scopes</text><text class="node-body" x="550" y="897" text-anchor="middle">Lesser Conduits + SpellSpace</text>
  <rect class="execution" x="715" y="845" width="210" height="70" rx="15"/><text class="node-title" x="820" y="873" text-anchor="middle">Resolved objects</text><text class="node-body" x="820" y="897" text-anchor="middle">creation order retained</text>
  <path class="edge" d="M520 640 V660 H255 V690"/><path class="edge" d="M520 640 V690"/><path class="edge" d="M705 734 H725"/><path class="edge" d="M840 778 V815 H550 V845"/><path class="edge" d="M840 778 V845"/>

  <rect class="cleanup-panel" x="1010" y="520" width="520" height="430" rx="24"/><rect x="1044" y="504" width="274" height="34" rx="8" fill="#fff9f5"/><text class="panel-title" x="1060" y="528">Teardown · narrow before broad</text>
  <g><circle class="number" cx="1065" cy="600" r="15"/><text class="number-text" x="1065" y="604" text-anchor="middle">1</text><rect class="cleanup" x="1100" y="570" width="365" height="60" rx="13"/><text class="node-title" x="1282" y="596" text-anchor="middle">Stop new work and drain tickets</text><text class="node-body" x="1282" y="618" text-anchor="middle">gates close before state changes</text></g>
  <g><circle class="number" cx="1065" cy="675" r="15"/><text class="number-text" x="1065" y="679" text-anchor="middle">2</text><rect class="cleanup" x="1100" y="645" width="365" height="60" rx="13"/><text class="node-title" x="1282" y="671" text-anchor="middle">Clean SpellSpace and lesser scopes</text><text class="node-body" x="1282" y="693" text-anchor="middle">request and child lifetimes first</text></g>
  <g><circle class="number" cx="1065" cy="750" r="15"/><text class="number-text" x="1065" y="754" text-anchor="middle">3</text><rect class="cleanup" x="1100" y="720" width="365" height="60" rx="13"/><text class="node-title" x="1282" y="746" text-anchor="middle">Dispose every created object</text><text class="node-body" x="1282" y="768" text-anchor="middle">reverse creation order</text></g>
  <g><circle class="number" cx="1065" cy="825" r="15"/><text class="number-text" x="1065" y="829" text-anchor="middle">4</text><rect class="cleanup" x="1100" y="795" width="365" height="60" rx="13"/><text class="node-title" x="1282" y="821" text-anchor="middle">Clean Conduit then frame services</text><text class="node-body" x="1282" y="843" text-anchor="middle">detach registries before owners</text></g>
  <g><circle class="number" cx="1065" cy="900" r="15"/><text class="number-text" x="1065" y="904" text-anchor="middle">5</text><rect class="cleanup" x="1100" y="870" width="365" height="60" rx="13"/><text class="node-title" x="1282" y="896" text-anchor="middle">Clean hosted roots; logger last</text><text class="node-body" x="1282" y="918" text-anchor="middle">reporting survives the teardown</text></g>
  <path class="cleanup-edge" d="M1485 600 V900"/>
  <text class="footer" x="70" y="1025">Ownership is explicit at each layer; cleanup composes scope order with reverse object-creation order.</text><text class="footer" x="1530" y="1025" text-anchor="end">Authored static view · not source-generated</text>
</svg>
