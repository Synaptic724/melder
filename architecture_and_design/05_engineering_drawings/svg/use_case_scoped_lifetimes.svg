<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="lifetime-title lifetime-desc">
  <title id="lifetime-title">Scoped lifetime use cases</title>
  <desc id="lifetime-desc">A developer chooses Existence at bind time. Application workloads resolve objects scoped to a frame, conduit lineage or cluster, one conduit, an active spell space, or a single meld. Operators inspect live-creation status without constructing and clean scopes in narrow-to-broad order.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#172033" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L12 6 L0 12z" fill="#40536d"/></marker>
    <style>
      .canvas{fill:#f8fafc}.title{font:700 34px "Segoe UI",Arial,sans-serif;fill:#10213d}.subtitle{font:400 18px "Segoe UI",Arial,sans-serif;fill:#52627a}.eyebrow{font:700 14px "Segoe UI",Arial,sans-serif;letter-spacing:1.6px;fill:#3f7a56}.boundary{fill:#fff;stroke:#3f7a56;stroke-width:3}.boundary-title{font:700 18px "Segoe UI",Arial,sans-serif;fill:#153824}
      .actor{fill:#fff3d6;stroke:#9a6700;stroke-width:2.5}.definition{fill:#e8f0ff;stroke:#315a99;stroke-width:2.5}.shared{fill:#e7f7fa;stroke:#287a88;stroke-width:2.5}.execution{fill:#eaf7ef;stroke:#3f7a56;stroke-width:2.5}.governance{fill:#f4eaff;stroke:#7552a3;stroke-width:2.5}.node-title{font:700 16px "Segoe UI",Arial,sans-serif;fill:#172033}.node-body{font:400 12.5px "Segoe UI",Arial,sans-serif;fill:#42526a}.actor-title{font:700 18px "Segoe UI",Arial,sans-serif;fill:#172033}.edge{fill:none;stroke:#40536d;stroke-width:2.7;marker-end:url(#arrow)}.relation{fill:none;stroke:#64748b;stroke-width:2.2;stroke-dasharray:8 6;marker-end:url(#arrow)}.footer{font:400 13px "Segoe UI",Arial,sans-serif;fill:#64748b}
    </style>
  </defs>
  <rect class="canvas" width="1600" height="1040"/>
  <text class="eyebrow" x="70" y="58">ENGINEERING DRAWINGS · USE CASE</text><text class="title" x="70" y="104">Choose reuse by ownership boundary, not by container folklore</text><text class="subtitle" x="70" y="137">Existence routes one resolved object into the lifetime store whose owner can clean it correctly.</text>
  <rect class="boundary" x="300" y="170" width="1000" height="760" rx="28"/><rect x="336" y="154" width="264" height="34" rx="8" fill="#fff"/><text class="boundary-title" x="352" y="178">Melder lifetime routing</text>

  <rect class="actor" x="48" y="235" width="205" height="125" rx="18" filter="url(#shadow)"/><circle cx="92" cy="277" r="18" fill="#fff" stroke="#9a6700" stroke-width="2"/><path d="M66 337 Q92 305 118 337" fill="#fff" stroke="#9a6700" stroke-width="2"/><text class="actor-title" x="178" y="284" text-anchor="middle">Developer</text><text class="node-body" x="174" y="315" text-anchor="middle">selects Existence</text>
  <rect class="actor" x="48" y="545" width="205" height="125" rx="18" filter="url(#shadow)"/><rect x="70" y="585" width="48" height="38" rx="6" fill="#fff" stroke="#9a6700" stroke-width="2"/><text class="actor-title" x="180" y="593" text-anchor="middle">Workload</text><text class="node-body" x="177" y="624" text-anchor="middle">resolves objects</text>
  <rect class="actor" x="1347" y="545" width="205" height="125" rx="18" filter="url(#shadow)"/><path d="M1372 591 h34 l12 16 -12 16 h-34 l-12-16z" fill="#fff" stroke="#9a6700" stroke-width="2"/><text class="actor-title" x="1477" y="593" text-anchor="middle">Operator</text><text class="node-body" x="1460" y="624" text-anchor="middle">inspects + cleans</text>

  <ellipse class="definition" cx="500" cy="260" rx="145" ry="64" filter="url(#shadow)"/><text class="node-title" x="500" y="253" text-anchor="middle">Choose Existence at bind</text><text class="node-body" x="500" y="279" text-anchor="middle">one policy per spell</text>
  <ellipse class="execution" cx="500" cy="480" rx="145" ry="64" filter="url(#shadow)"/><text class="node-title" x="500" y="473" text-anchor="middle">Resolve by Existence</text><text class="node-body" x="500" y="499" text-anchor="middle">route to the owning scope</text>
  <ellipse class="shared" cx="800" cy="260" rx="140" ry="64" filter="url(#shadow)"/><text class="node-title" x="800" y="252" text-anchor="middle">Frame singleton</text><text class="node-body" x="800" y="278" text-anchor="middle">unique</text>
  <ellipse class="shared" cx="1090" cy="300" rx="155" ry="76" filter="url(#shadow)"/><text class="node-title" x="1090" y="278" text-anchor="middle">Shared subsystem</text><text class="node-body" x="1090" y="304" text-anchor="middle">unique_per_conduit_lineage</text><text class="node-body" x="1090" y="327" text-anchor="middle">unique_per_conduit_cluster</text>
  <ellipse class="execution" cx="800" cy="480" rx="135" ry="60" filter="url(#shadow)"/><text class="node-title" x="800" y="473" text-anchor="middle">Conduit-local instance</text><text class="node-body" x="800" y="499" text-anchor="middle">unique_per_conduit</text>
  <ellipse class="execution" cx="1080" cy="500" rx="150" ry="70" filter="url(#shadow)"/><text class="node-title" x="1080" y="486" text-anchor="middle">Active request instance</text><text class="node-body" x="1080" y="512" text-anchor="middle">unique_per_spell_space</text><text class="node-body" x="1080" y="535" text-anchor="middle">requires active SpellSpace</text>
  <ellipse class="execution" cx="800" cy="700" rx="135" ry="60" filter="url(#shadow)"/><text class="node-title" x="800" y="693" text-anchor="middle">New instance per resolve</text><text class="node-body" x="800" y="719" text-anchor="middle">many</text>
  <ellipse class="governance" cx="500" cy="700" rx="145" ry="70" filter="url(#shadow)"/><text class="node-title" x="500" y="686" text-anchor="middle">Inspect live status</text><text class="node-body" x="500" y="712" text-anchor="middle">no-create probe</text><text class="node-body" x="500" y="735" text-anchor="middle">presence · scope · count</text>
  <ellipse class="governance" cx="1080" cy="760" rx="155" ry="72" filter="url(#shadow)"/><text class="node-title" x="1080" y="745" text-anchor="middle">Clean deterministic scopes</text><text class="node-body" x="1080" y="771" text-anchor="middle">SpellSpace before Conduit</text><text class="node-body" x="1080" y="794" text-anchor="middle">frame owner last</text>

  <path class="edge" d="M253 275 H355"/><path class="edge" d="M253 600 H280 V480 H355"/><path class="edge" d="M1347 630 H1235"/><path class="edge" d="M1347 585 H1320 V825 H500 V770"/>
  <path class="relation" d="M500 324 V416"/><path class="relation" d="M645 480 H665"/><path class="relation" d="M585 425 V360 H800 V324"/><path class="relation" d="M585 535 V615 H800 V640"/>
  <path class="relation" d="M1080 570 V688"/><path class="relation" d="M800 540 V640"/>
  <text class="footer" x="70" y="985">The lifetime name states who reuses and who cleans; `many` is the only always-new lane.</text><text class="footer" x="1530" y="985" text-anchor="end">Authored static view · not source-generated</text>
</svg>
