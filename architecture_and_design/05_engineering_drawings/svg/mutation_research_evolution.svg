<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040"
     viewBox="0 0 1600 1040" role="img"
     aria-labelledby="research-flow-title research-flow-desc">
  <title id="research-flow-title">MutationResearch governed evolution loop</title>
  <desc id="research-flow-desc">
    A live world entry is declared into one research lane and residence. Agents inspect
    recorded evidence, preview or synthesize without execution, stage an accepted
    candidate, promote it through a governed notch, realize it through meld, and record
    the result. A retained prior member provides deliberate revert.
  </desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#172033" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L12 6 L0 12z" fill="#40536d"/></marker>
    <style>
      .canvas{fill:#f8fafc}.title{font:700 34px "Segoe UI",Arial,sans-serif;fill:#10213d}.subtitle{font:400 18px "Segoe UI",Arial,sans-serif;fill:#52627a}
      .eyebrow{font:700 14px "Segoe UI",Arial,sans-serif;letter-spacing:1.6px;fill:#7552a3}.research{fill:#f4eaff;stroke:#7552a3;stroke-width:2.5}
      .runtime{fill:#eaf7ef;stroke:#3f7a56;stroke-width:2.5}.governance{fill:#e8f0ff;stroke:#315a99;stroke-width:2.5}.invariant{fill:#fff3d6;stroke:#9a6700;stroke-width:2.2}
      .node-title{font:700 16px "Segoe UI",Arial,sans-serif;fill:#172033}.node-body{font:400 12px "Segoe UI",Arial,sans-serif;fill:#42526a}.edge{fill:none;stroke:#40536d;stroke-width:3;marker-end:url(#arrow)}
      .edge-dashed{fill:none;stroke:#64748b;stroke-width:2.4;stroke-dasharray:8 6;marker-end:url(#arrow)}.step{fill:#315a99}.step-text{font:700 12px "Segoe UI",Arial,sans-serif;fill:#fff}
      .center-title{font:700 18px "Segoe UI",Arial,sans-serif;fill:#4b3410}.center-body{font:600 13px "Segoe UI",Arial,sans-serif;fill:#5c4620}.footer{font:400 13px "Segoe UI",Arial,sans-serif;fill:#64748b}
    </style>
  </defs>
  <rect class="canvas" width="1600" height="1040"/>
  <text class="eyebrow" x="70" y="58">ENGINEERING DRAWINGS · ADVANCED FLOW</text>
  <text class="title" x="70" y="104">MutationResearch: evidence before execution, governance before promotion</text>
  <text class="subtitle" x="70" y="137">The loop preserves declaration history, rehearses change, and makes live selection reversible.</text>

  <circle cx="800" cy="565" r="255" fill="#fff" stroke="#d7c5ea" stroke-width="3" stroke-dasharray="10 8"/>
  <circle class="invariant" cx="800" cy="565" r="150" filter="url(#shadow)"/>
  <text class="center-title" x="800" y="520" text-anchor="middle">Invariant core</text>
  <text class="center-body" x="800" y="555" text-anchor="middle">one identity · one residence lane</text>
  <text class="center-body" x="800" y="582" text-anchor="middle">append-only journal</text>
  <text class="center-body" x="800" y="609" text-anchor="middle">preview changes nothing</text>
  <text class="center-body" x="800" y="636" text-anchor="middle">bind + notch + meld make it live</text>

  <rect class="runtime" x="170" y="250" width="230" height="100" rx="18" filter="url(#shadow)"/><text class="node-title" x="285" y="286" text-anchor="middle">Live world entry</text><text class="node-body" x="285" y="315" text-anchor="middle">bind / bind_inactive</text>
  <rect class="research" x="455" y="205" width="245" height="110" rx="18" filter="url(#shadow)"/><text class="node-title" x="578" y="242" text-anchor="middle">Declare + reside</text><text class="node-body" x="578" y="270" text-anchor="middle">ResearchSet · lane · node</text><text class="node-body" x="578" y="293" text-anchor="middle">single residence claim</text>
  <rect class="research" x="900" y="205" width="245" height="110" rx="18" filter="url(#shadow)"/><text class="node-title" x="1022" y="242" text-anchor="middle">Inspect evidence</text><text class="node-body" x="1022" y="270" text-anchor="middle">source · drift · diff · impact</text><text class="node-body" x="1022" y="293" text-anchor="middle">residence + campaign</text>
  <rect class="research" x="1210" y="350" width="245" height="110" rx="18" filter="url(#shadow)"/><text class="node-title" x="1332" y="387" text-anchor="middle">Preview / synthesize</text><text class="node-body" x="1332" y="415" text-anchor="middle">candidate diff + radius</text><text class="node-body" x="1332" y="438" text-anchor="middle">no execution or bind</text>
  <rect class="research" x="1210" y="665" width="245" height="110" rx="18" filter="url(#shadow)"/><text class="node-title" x="1332" y="702" text-anchor="middle">Stage candidate</text><text class="node-body" x="1332" y="730" text-anchor="middle">ancestry + inactive member</text><text class="node-body" x="1332" y="753" text-anchor="middle">accepted code only</text>
  <rect class="governance" x="900" y="820" width="245" height="110" rx="18" filter="url(#shadow)"/><text class="node-title" x="1022" y="857" text-anchor="middle">Governed notch</text><text class="node-body" x="1022" y="885" text-anchor="middle">transaction · park old · select new</text><text class="node-body" x="1022" y="908" text-anchor="middle">mark affected truth dirty</text>
  <rect class="runtime" x="455" y="820" width="245" height="110" rx="18" filter="url(#shadow)"/><text class="node-title" x="578" y="857" text-anchor="middle">Meld selected version</text><text class="node-body" x="578" y="885" text-anchor="middle">revalidate · realize instance</text><text class="node-body" x="578" y="908" text-anchor="middle">new runtime selection</text>
  <rect class="research" x="145" y="665" width="255" height="110" rx="18" filter="url(#shadow)"/><text class="node-title" x="272" y="702" text-anchor="middle">Record promotion</text><text class="node-body" x="272" y="730" text-anchor="middle">journal + composition twin</text><text class="node-body" x="272" y="753" text-anchor="middle">new evidence for next pass</text>

  <path class="edge" d="M400 280 H455"/><path class="edge" d="M700 260 H900"/><path class="edge" d="M1145 285 L1210 375"/>
  <path class="edge" d="M1332 460 V665"/><path class="edge" d="M1210 745 L1145 845"/><path class="edge" d="M900 875 H700"/>
  <path class="edge" d="M455 875 L400 745"/><path class="edge" d="M272 665 L250 350"/><path class="edge-dashed" d="M400 710 H455 V875"/>
  <path class="edge-dashed" d="M145 700 H110 V170 H1022 V205"/>

  <circle class="step" cx="427" cy="280" r="14"/><text class="step-text" x="427" y="284" text-anchor="middle">1</text>
  <circle class="step" cx="800" cy="260" r="14"/><text class="step-text" x="800" y="264" text-anchor="middle">2</text>
  <circle class="step" cx="1178" cy="333" r="14"/><text class="step-text" x="1178" y="337" text-anchor="middle">3</text>
  <circle class="step" cx="1332" cy="565" r="14"/><text class="step-text" x="1332" y="569" text-anchor="middle">4</text>
  <circle class="step" cx="1178" cy="797" r="14"/><text class="step-text" x="1178" y="801" text-anchor="middle">5</text>
  <circle class="step" cx="800" cy="875" r="14"/><text class="step-text" x="800" y="879" text-anchor="middle">6</text>
  <circle class="step" cx="427" cy="810" r="14"/><text class="step-text" x="427" y="814" text-anchor="middle">7</text>
  <circle class="step" cx="260" cy="510" r="14"/><text class="step-text" x="260" y="514" text-anchor="middle">8</text>

  <rect class="invariant" x="1210" y="865" width="250" height="62" rx="12"/><text class="node-title" x="1335" y="891" text-anchor="middle">Deliberate revert</text><text class="node-body" x="1335" y="916" text-anchor="middle">notch retained prior member</text><path class="edge-dashed" d="M1210 895 H1145"/>
  <text class="footer" x="70" y="990">Research holds evidence and organization; Conduit + DevOps own live selection; Meld realizes it.</text>
  <text class="footer" x="1530" y="990" text-anchor="end">Authored static view · not source-generated</text>
</svg>
