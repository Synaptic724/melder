<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1160"
     viewBox="0 0 1700 1160" role="img"
     aria-labelledby="nexus-flow-title nexus-flow-desc">
  <title id="nexus-flow-title">Nexus and Rift access flow</title>
  <desc id="nexus-flow-desc">
    A sequence from Nexus configuration and Rift creation through managed frame
    realization, frame-link policy, projection compilation, room operation, and
    gate-controlled ACL refresh.
  </desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#172033" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L12 6 L0 12z" fill="#40536d"/></marker>
    <style>
      .canvas{fill:#f8fafc}.title{font:700 34px "Segoe UI",Arial,sans-serif;fill:#10213d}.subtitle{font:400 18px "Segoe UI",Arial,sans-serif;fill:#52627a}
      .eyebrow{font:700 14px "Segoe UI",Arial,sans-serif;letter-spacing:1.6px;fill:#287a88}.participant{fill:#fff;stroke:#287a88;stroke-width:2.5}
      .participant.actor{fill:#fff3d6;stroke:#9a6700}.p-title{font:700 16px "Segoe UI",Arial,sans-serif;fill:#172033}.p-body{font:400 12px "Segoe UI",Arial,sans-serif;fill:#52627a}
      .lifeline{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 6}.phase-create{fill:#f1fbfc}.phase-attach{fill:#faf6ff}.phase-operate{fill:#f4fbf6}.phase-refresh{fill:#fff8f4}
      .phase-title{font:700 12px "Segoe UI",Arial,sans-serif;letter-spacing:1px;fill:#52627a}.message{fill:none;stroke:#40536d;stroke-width:2.5;marker-end:url(#arrow)}
      .return{fill:none;stroke:#64748b;stroke-width:2.2;stroke-dasharray:8 6;marker-end:url(#arrow)}.m-label{font:600 12px "Segoe UI",Arial,sans-serif;fill:#34445b}
      .step{fill:#315a99}.step-text{font:700 11px "Segoe UI",Arial,sans-serif;fill:#fff}.note{fill:#fff3d6;stroke:#d7ad53;stroke-width:1.5}
      .note-text{font:600 12px "Segoe UI",Arial,sans-serif;fill:#4b3410}.footer{font:400 13px "Segoe UI",Arial,sans-serif;fill:#64748b}
    </style>
  </defs>
  <rect class="canvas" width="1700" height="1160"/>
  <text class="eyebrow" x="70" y="58">ENGINEERING DRAWINGS · ADVANCED FLOW</text>
  <text class="title" x="70" y="104">Nexus → Rift → room: access, operation, and refresh</text>
  <text class="subtitle" x="70" y="137">The room never bypasses frame policy; current projections remain Rift-owned and refreshable.</text>

  <rect class="phase-create" x="65" y="250" width="1570" height="185" rx="18"/><text class="phase-title" x="82" y="275">1 · CONFIGURE + CREATE</text>
  <rect class="phase-attach" x="65" y="445" width="1570" height="260" rx="18"/><text class="phase-title" x="82" y="470">2 · REALIZE + ATTACH</text>
  <rect class="phase-operate" x="65" y="715" width="1570" height="185" rx="18"/><text class="phase-title" x="82" y="740">3 · OPERATE INSIDE THE ROOM</text>
  <rect class="phase-refresh" x="65" y="910" width="1570" height="185" rx="18"/><text class="phase-title" x="82" y="935">4 · ACL REVISION + GATE-CONTROLLED REFRESH</text>

  <rect class="participant actor" x="65" y="170" width="210" height="64" rx="14" filter="url(#shadow)"/><text class="p-title" x="170" y="198" text-anchor="middle">Operator / agent</text><text class="p-body" x="170" y="220" text-anchor="middle">requesting actor</text>
  <rect class="participant" x="330" y="170" width="210" height="64" rx="14" filter="url(#shadow)"/><text class="p-title" x="435" y="198" text-anchor="middle">Nexus</text><text class="p-body" x="435" y="220" text-anchor="middle">policy + registry root</text>
  <rect class="participant" x="595" y="170" width="220" height="64" rx="14" filter="url(#shadow)"/><text class="p-title" x="705" y="198" text-anchor="middle">Frame policy</text><text class="p-body" x="705" y="220" text-anchor="middle">manager · descriptor · ACL</text>
  <rect class="participant" x="875" y="170" width="210" height="64" rx="14" filter="url(#shadow)"/><text class="p-title" x="980" y="198" text-anchor="middle">Rift</text><text class="p-body" x="980" y="220" text-anchor="middle">gate + links + projections</text>
  <rect class="participant" x="1140" y="170" width="210" height="64" rx="14" filter="url(#shadow)"/><text class="p-title" x="1245" y="198" text-anchor="middle">RiftSpace</text><text class="p-body" x="1245" y="220" text-anchor="middle">viewer · workstation · commands</text>
  <rect class="participant" x="1405" y="170" width="210" height="64" rx="14" filter="url(#shadow)"/><text class="p-title" x="1510" y="198" text-anchor="middle">Frame runtime</text><text class="p-body" x="1510" y="220" text-anchor="middle">Spellbook · Conduit · objects</text>

  <path class="lifeline" d="M170 234 V1095"/><path class="lifeline" d="M435 234 V1095"/><path class="lifeline" d="M705 234 V1095"/>
  <path class="lifeline" d="M980 234 V1095"/><path class="lifeline" d="M1245 234 V1095"/><path class="lifeline" d="M1510 234 V1095"/>

  <circle class="step" cx="188" cy="312" r="13"/><text class="step-text" x="188" y="316" text-anchor="middle">1</text><path class="message" d="M205 312 H418"/><text class="m-label" x="310" y="302" text-anchor="middle">configure + enable</text>
  <circle class="step" cx="188" cy="365" r="13"/><text class="step-text" x="188" y="369" text-anchor="middle">2</text><path class="message" d="M205 365 H418"/><text class="m-label" x="310" y="355" text-anchor="middle">create_rift(room posture)</text>
  <circle class="step" cx="453" cy="410" r="13"/><text class="step-text" x="453" y="414" text-anchor="middle">3</text><path class="message" d="M470 410 H963"/><text class="m-label" x="716" y="400" text-anchor="middle">construct + register Rift; create one primary room</text>

  <circle class="step" cx="188" cy="505" r="13"/><text class="step-text" x="188" y="509" text-anchor="middle">4</text><path class="message" d="M205 505 H688"/><text class="m-label" x="447" y="495" text-anchor="middle">create / recover managed frame</text>
  <circle class="step" cx="723" cy="555" r="13"/><text class="step-text" x="723" y="559" text-anchor="middle">5</text><path class="message" d="M740 555 H1493"/><text class="m-label" x="1116" y="545" text-anchor="middle">realize through Spellbook.conjure → rooted Conduit</text>
  <circle class="step" cx="188" cy="605" r="13"/><text class="step-text" x="188" y="609" text-anchor="middle">6</text><path class="message" d="M205 605 H963"/><text class="m-label" x="584" y="595" text-anchor="middle">Rift.create_frame_link(frame)</text>
  <circle class="step" cx="963" cy="655" r="13"/><text class="step-text" x="963" y="659" text-anchor="middle">7</text><path class="message" d="M946 655 H722"/><text class="m-label" x="834" y="645" text-anchor="middle">validate target + require descriptor / ACL</text>
  <path class="return" d="M722 690 H963"/><text class="m-label" x="843" y="680" text-anchor="middle">selected contracts + compiled projection set</text>

  <circle class="step" cx="998" cy="765" r="13"/><text class="step-text" x="998" y="769" text-anchor="middle">8</text><path class="message" d="M1015 765 H1228"/><text class="m-label" x="1121" y="755" text-anchor="middle">apply room assets</text>
  <circle class="step" cx="188" cy="820" r="13"/><text class="step-text" x="188" y="824" text-anchor="middle">9</text><path class="message" d="M205 820 H1228"/><text class="m-label" x="716" y="810" text-anchor="middle">inspect projections · bind target · execute allowed command</text>
  <circle class="step" cx="1263" cy="870" r="13"/><text class="step-text" x="1263" y="874" text-anchor="middle">10</text><path class="message" d="M1280 870 H1493"/><text class="m-label" x="1386" y="860" text-anchor="middle">RiftGate ticket + current projection</text>

  <circle class="step" cx="723" cy="960" r="13"/><text class="step-text" x="723" y="964" text-anchor="middle">11</text><path class="message" d="M740 960 H418"/><text class="m-label" x="579" y="950" text-anchor="middle">ACL family revision</text>
  <circle class="step" cx="453" cy="1008" r="13"/><text class="step-text" x="453" y="1012" text-anchor="middle">12</text><path class="message" d="M470 1008 H963"/><text class="m-label" x="716" y="998" text-anchor="middle">disable gate · drain · compile changed-frame subset</text>
  <circle class="step" cx="998" cy="1054" r="13"/><text class="step-text" x="998" y="1058" text-anchor="middle">13</text><path class="message" d="M1015 1054 H1228"/><text class="m-label" x="1121" y="1044" text-anchor="middle">merge + reapply projections</text>
  <path class="return" d="M1228 1082 H998"/><text class="m-label" x="1113" y="1074" text-anchor="middle">reopen gate</text>

  <rect class="note" x="1340" y="270" width="250" height="88" rx="12"/><text class="note-text" x="1465" y="298" text-anchor="middle">Rift creation is frame-free.</text><text class="note-text" x="1465" y="324" text-anchor="middle">Attachment is explicit and</text><text class="note-text" x="1465" y="346" text-anchor="middle">requires current descriptor truth.</text>
  <text class="footer" x="70" y="1130">The same Rift owns its gate, frame-link contracts, projection registry, and one room.</text>
  <text class="footer" x="1630" y="1130" text-anchor="end">Authored static view · not source-generated</text>
</svg>
