<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060"
     viewBox="0 0 1600 1060" role="img"
     aria-labelledby="continuity-uc-title continuity-uc-desc">
  <title id="continuity-uc-title">Continuity and research use cases</title>
  <desc id="continuity-uc-desc">
    Applications emit structural truth. Operators activate recording, checkpoint,
    store, reload, and restore through Crystallizer. Agents declare research versions,
    inspect evidence, preview or synthesize candidates, stage them, and promote or revert.
  </desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#172033" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L12 6 L0 12z" fill="#40536d"/></marker>
    <style>
      .canvas{fill:#f8fafc}.title{font:700 34px "Segoe UI",Arial,sans-serif;fill:#10213d}.subtitle{font:400 18px "Segoe UI",Arial,sans-serif;fill:#52627a}
      .eyebrow{font:700 14px "Segoe UI",Arial,sans-serif;letter-spacing:1.6px;fill:#a4552a}.boundary{fill:#fff;stroke:#a4552a;stroke-width:3}
      .boundary-title{font:700 18px "Segoe UI",Arial,sans-serif;fill:#4a2411}.actor{fill:#fff3d6;stroke:#9a6700;stroke-width:2.5}
      .continuity{fill:#fff0e8;stroke:#a4552a;stroke-width:2.5}.research{fill:#f4eaff;stroke:#7552a3;stroke-width:2.5}
      .node-title{font:700 17px "Segoe UI",Arial,sans-serif;fill:#172033}.node-body{font:400 13px "Segoe UI",Arial,sans-serif;fill:#42526a}.actor-title{font:700 18px "Segoe UI",Arial,sans-serif;fill:#172033}
      .edge{fill:none;stroke:#40536d;stroke-width:2.8;marker-end:url(#arrow)}.relation{fill:none;stroke:#64748b;stroke-width:2.4;stroke-dasharray:8 6;marker-end:url(#arrow)}
      .group-label{font:700 13px "Segoe UI",Arial,sans-serif;letter-spacing:1px;fill:#52627a}.footer{font:400 13px "Segoe UI",Arial,sans-serif;fill:#64748b}
    </style>
  </defs>
  <rect class="canvas" width="1600" height="1060"/>
  <text class="eyebrow" x="70" y="58">ENGINEERING DRAWINGS · USE CASE</text>
  <text class="title" x="70" y="104">How a world is preserved and deliberately evolved</text>
  <text class="subtitle" x="70" y="137">Crystallizer owns continuity; MutationResearch owns declared change history and candidate evidence.</text>

  <rect class="boundary" x="300" y="170" width="1000" height="790" rx="28"/>
  <rect x="336" y="154" width="332" height="34" rx="8" fill="#fff"/><text class="boundary-title" x="352" y="178">Crystallizer + MutationResearch</text>
  <text class="group-label" x="365" y="230">CONTINUITY USE CASES</text><text class="group-label" x="865" y="205">RESEARCH + EVOLUTION USE CASES</text>

  <rect class="actor" x="44" y="250" width="205" height="120" rx="18" filter="url(#shadow)"/><text class="actor-title" x="146" y="294" text-anchor="middle">Live application</text><text class="node-body" x="146" y="326" text-anchor="middle">emits structural truth</text>
  <rect class="actor" x="44" y="470" width="205" height="120" rx="18" filter="url(#shadow)"/><text class="actor-title" x="146" y="514" text-anchor="middle">Operator</text><text class="node-body" x="146" y="546" text-anchor="middle">owns continuity workflow</text>
  <rect class="actor" x="44" y="700" width="205" height="120" rx="18" filter="url(#shadow)"/><text class="actor-title" x="146" y="744" text-anchor="middle">Tool / agent</text><text class="node-body" x="146" y="776" text-anchor="middle">investigates futures</text>
  <ellipse cx="1438" cy="420" rx="100" ry="28" fill="#fff3d6" stroke="#9a6700" stroke-width="2.5"/><path d="M1338 420 v58 c0 15 45 28 100 28s100-13 100-28v-58" fill="#fff3d6" stroke="#9a6700" stroke-width="2.5"/><text class="actor-title" x="1438" y="456" text-anchor="middle">External store</text><text class="node-body" x="1438" y="481" text-anchor="middle">optional detached custody</text>

  <ellipse class="continuity" cx="500" cy="300" rx="150" ry="66" filter="url(#shadow)"/><text class="node-title" x="500" y="293" text-anchor="middle">Activate recording</text><text class="node-body" x="500" y="319" text-anchor="middle">configure profile + policy</text>
  <ellipse class="continuity" cx="500" cy="485" rx="150" ry="66" filter="url(#shadow)"/><text class="node-title" x="500" y="478" text-anchor="middle">Record structural twins</text><text class="node-body" x="500" y="504" text-anchor="middle">replace current profile truth</text>
  <ellipse class="continuity" cx="500" cy="680" rx="150" ry="66" filter="url(#shadow)"/><text class="node-title" x="500" y="673" text-anchor="middle">Seal + flush checkpoint</text><text class="node-body" x="500" y="699" text-anchor="middle">detached value records</text>
  <ellipse class="continuity" cx="500" cy="855" rx="150" ry="66" filter="url(#shadow)"/><text class="node-title" x="500" y="848" text-anchor="middle">Reload + restore</text><text class="node-body" x="500" y="874" text-anchor="middle">preflight · public verbs · report</text>

  <ellipse class="research" cx="875" cy="285" rx="150" ry="66" filter="url(#shadow)"/><text class="node-title" x="875" y="278" text-anchor="middle">Declare research world</text><text class="node-body" x="875" y="304" text-anchor="middle">versions · lanes · compositions</text>
  <ellipse class="research" cx="1100" cy="415" rx="155" ry="66" filter="url(#shadow)"/><text class="node-title" x="1100" y="408" text-anchor="middle">Inspect evidence</text><text class="node-body" x="1100" y="434" text-anchor="middle">residence · source · drift · impact</text>
  <ellipse class="research" cx="875" cy="555" rx="150" ry="66" filter="url(#shadow)"/><text class="node-title" x="875" y="548" text-anchor="middle">Preview / synthesize</text><text class="node-body" x="875" y="574" text-anchor="middle">candidate diff + radius + verdict</text>
  <ellipse class="research" cx="1100" cy="690" rx="155" ry="66" filter="url(#shadow)"/><text class="node-title" x="1100" y="683" text-anchor="middle">Stage candidate</text><text class="node-body" x="1100" y="709" text-anchor="middle">ancestry or inactive member</text>
  <ellipse class="research" cx="875" cy="835" rx="150" ry="66" filter="url(#shadow)"/><text class="node-title" x="875" y="828" text-anchor="middle">Promote / revert</text><text class="node-body" x="875" y="854" text-anchor="middle">governed notch + live selection</text>

  <path class="edge" d="M249 300 H350"/><path class="edge" d="M249 330 H315 V485 H350"/>
  <path class="edge" d="M249 510 H330 V300 H350"/><path class="edge" d="M249 540 H320 V680 H350"/><path class="edge" d="M249 570 H310 V855 H350"/>
  <path class="edge" d="M249 735 H725"/><path class="edge" d="M249 760 H700 V555 H725"/><path class="edge" d="M249 785 H690 V690 H945"/><path class="edge" d="M249 810 H725 V835"/>
  <path class="relation" d="M650 680 H680 V945 H1320 V450 H1338"/><path class="relation" d="M1338 480 H1305 V915 H680 V855 H650"/>
  <path class="relation" d="M500 366 V419"/><path class="relation" d="M500 551 V614"/>
  <path class="relation" d="M1025 285 H1080 V349"/><path class="relation" d="M1045 455 H980 V519"/><path class="relation" d="M1025 555 H1080 V624"/><path class="relation" d="M1020 730 H940 V769"/>
  <path class="relation" d="M875 901 V930 H270 V330 H249"/>
  <text class="footer" x="70" y="1010">Continuity reconstructs a world. Research organizes evidence and deliberate version transitions.</text>
  <text class="footer" x="1530" y="1010" text-anchor="end">Authored static view · not source-generated</text>
</svg>
