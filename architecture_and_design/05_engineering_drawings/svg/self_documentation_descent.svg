<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="docs-title docs-desc">
  <title id="docs-title">Melder self-documentation build and reading descent</title>
  <desc id="docs-desc">Authored architecture, component, and graph document-index pairs are verified by the build asset runner and system-document builder, then emitted as generated Python manifests, deferred section tables, lazy text payloads, and graph adjacency. Runtime publishes four package-root query views. Readers descend from architecture through focused component and graph queries to source code. Handmade engineering drawings remain outside generation.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#172033" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L12 6 L0 12z" fill="#40536d"/></marker>
    <style>
      .canvas{fill:#f8fafc}.title{font:700 34px "Segoe UI",Arial,sans-serif;fill:#10213d}.subtitle{font:400 18px "Segoe UI",Arial,sans-serif;fill:#52627a}.eyebrow{font:700 14px "Segoe UI",Arial,sans-serif;letter-spacing:1.6px;fill:#287a88}
      .build-panel{fill:#f7faff;stroke:#6889bb;stroke-width:2.5}.read-panel{fill:#f5fbf7;stroke:#5b8d6c;stroke-width:2.5}.panel-title{font:700 18px "Segoe UI",Arial,sans-serif;fill:#23344d}.authored{fill:#fff3d6;stroke:#9a6700;stroke-width:2.5}.build{fill:#e8f0ff;stroke:#315a99;stroke-width:2.5}.runtime{fill:#e7f7fa;stroke:#287a88;stroke-width:2.5}.read{fill:#eaf7ef;stroke:#3f7a56;stroke-width:2.5}.static{fill:#fff0e8;stroke:#a4552a;stroke-width:2.3;stroke-dasharray:8 5}
      .node-title{font:700 16px "Segoe UI",Arial,sans-serif;fill:#172033}.node-body{font:400 13px "Segoe UI",Arial,sans-serif;fill:#42526a}.step{fill:#315a99}.step-text{font:700 12px "Segoe UI",Arial,sans-serif;fill:#fff}.edge{fill:none;stroke:#40536d;stroke-width:2.8;marker-end:url(#arrow)}.edge-dashed{fill:none;stroke:#64748b;stroke-width:2.2;stroke-dasharray:8 6;marker-end:url(#arrow)}.label{font:600 12px "Segoe UI",Arial,sans-serif;fill:#34445b}.footer{font:400 13px "Segoe UI",Arial,sans-serif;fill:#64748b}
    </style>
  </defs>
  <rect class="canvas" width="1600" height="1080"/>
  <text class="eyebrow" x="70" y="58">ENGINEERING DRAWINGS · SELF-DOCUMENTATION</text>
  <text class="title" x="70" y="104">The repository explains itself without putting the repository on the runtime path</text>
  <text class="subtitle" x="70" y="137">Build-time capture turns verified context maps into lazy in-process query surfaces; readers still finish at source code.</text>

  <rect class="build-panel" x="70" y="185" width="1460" height="330" rx="24"/><rect x="104" y="169" width="334" height="34" rx="8" fill="#f7faff"/><text class="panel-title" x="120" y="193">Build-time capture · authored maps to package code</text>
  <rect class="authored" x="105" y="285" width="205" height="115" rx="16" filter="url(#shadow)"/><text class="node-title" x="208" y="318" text-anchor="middle">Authored map pairs</text><text class="node-body" x="208" y="347" text-anchor="middle">architecture · components</text><text class="node-body" x="208" y="370" text-anchor="middle">graph + verified indexes</text>
  <rect class="build" x="355" y="285" width="205" height="115" rx="16" filter="url(#shadow)"/><text class="node-title" x="458" y="318" text-anchor="middle">Asset runner</text><text class="node-body" x="458" y="347" text-anchor="middle">discovers _builder.py</text><text class="node-body" x="458" y="370" text-anchor="middle">loads by file path</text>
  <rect class="build" x="605" y="285" width="205" height="115" rx="16" filter="url(#shadow)"/><text class="node-title" x="708" y="318" text-anchor="middle">Verification gate</text><text class="node-body" x="708" y="347" text-anchor="middle">line count + SHA-256</text><text class="node-body" x="708" y="370" text-anchor="middle">refuse stale pairs</text>
  <rect class="build" x="855" y="265" width="230" height="155" rx="16" filter="url(#shadow)"/><text class="node-title" x="970" y="300" text-anchor="middle">Generated Python assets</text><text class="node-body" x="970" y="330" text-anchor="middle">eager manifest</text><text class="node-body" x="970" y="353" text-anchor="middle">deferred section tables</text><text class="node-body" x="970" y="376" text-anchor="middle">lazy text payloads</text><text class="node-body" x="970" y="399" text-anchor="middle">graph adjacency</text>
  <rect class="runtime" x="1130" y="265" width="350" height="155" rx="16" filter="url(#shadow)"/><text class="node-title" x="1305" y="300" text-anchor="middle">Package-root query views</text><text class="node-body" x="1305" y="330" text-anchor="middle">__architecture__ · __components__</text><text class="node-body" x="1305" y="353" text-anchor="middle">__graph_network__ · __graph_details__</text><text class="node-body" x="1305" y="383" text-anchor="middle">manifest at import; text and graph lazy</text>
  <path class="edge" d="M310 342 H355"/><path class="edge" d="M560 342 H605"/><path class="edge" d="M810 342 H855"/><path class="edge" d="M1085 342 H1130"/>
  <text class="label" x="582" y="325" text-anchor="middle">verify</text><text class="label" x="1108" y="325" text-anchor="middle">publish</text>

  <rect class="read-panel" x="70" y="610" width="1460" height="290" rx="24"/><rect x="104" y="594" width="330" height="34" rx="8" fill="#f5fbf7"/><text class="panel-title" x="120" y="618">Reader descent · orientation to behavior truth</text>
  <rect class="read" x="105" y="700" width="215" height="105" rx="16"/><circle class="step" cx="125" cy="720" r="14"/><text class="step-text" x="125" y="724" text-anchor="middle">1</text><text class="node-title" x="213" y="733" text-anchor="middle">Architecture</text><text class="node-body" x="213" y="762" text-anchor="middle">read broad orientation</text><text class="node-body" x="213" y="785" text-anchor="middle">boundaries · boot · invariants</text>
  <rect class="read" x="390" y="700" width="215" height="105" rx="16"/><circle class="step" cx="410" cy="720" r="14"/><text class="step-text" x="410" y="724" text-anchor="middle">2</text><text class="node-title" x="498" y="733" text-anchor="middle">Components</text><text class="node-body" x="498" y="762" text-anchor="middle">index then focused get</text><text class="node-body" x="498" y="785" text-anchor="middle">owners · contracts · files</text>
  <rect class="read" x="675" y="700" width="215" height="105" rx="16"/><circle class="step" cx="695" cy="720" r="14"/><text class="step-text" x="695" y="724" text-anchor="middle">3</text><text class="node-title" x="783" y="733" text-anchor="middle">Graph network</text><text class="node-body" x="783" y="762" text-anchor="middle">walk nodes + edges</text><text class="node-body" x="783" y="785" text-anchor="middle">trust origin + why</text>
  <rect class="read" x="960" y="700" width="215" height="105" rx="16"/><circle class="step" cx="980" cy="720" r="14"/><text class="step-text" x="980" y="724" text-anchor="middle">4</text><text class="node-title" x="1068" y="733" text-anchor="middle">Graph details</text><text class="node-body" x="1068" y="762" text-anchor="middle">open source-path slice</text><text class="node-body" x="1068" y="785" text-anchor="middle">wiring + ownership prose</text>
  <rect class="read" x="1245" y="700" width="215" height="105" rx="16"/><circle class="step" cx="1265" cy="720" r="14"/><text class="step-text" x="1265" y="724" text-anchor="middle">5</text><text class="node-title" x="1353" y="733" text-anchor="middle">Source code</text><text class="node-body" x="1353" y="762" text-anchor="middle">read implementation</text><text class="node-body" x="1353" y="785" text-anchor="middle">behavioral authority</text>
  <path class="edge" d="M320 752 H390"/><path class="edge" d="M605 752 H675"/><path class="edge" d="M890 752 H960"/><path class="edge" d="M1175 752 H1245"/>

  <rect class="static" x="370" y="945" width="860" height="65" rx="15"/><text class="node-title" x="800" y="972" text-anchor="middle">Manual engineering drawings · SVG primary + Mermaid semantic companion</text><text class="node-body" x="800" y="996" text-anchor="middle">Separate documentation lane: source changes and build-asset runs do not regenerate these pictures.</text>
  <path class="edge-dashed" d="M208 400 V545 H42 V977 H370"/>
  <text class="footer" x="70" y="1045">Indexes make large documents addressable; lazy payloads make package import cheap; source code remains the final evidence tier.</text><text class="footer" x="1530" y="1045" text-anchor="end">Authored static view · not source-generated</text>
</svg>
