<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="linked-title linked-desc">
  <title id="linked-title">Linked dynamic subsystem use cases</title>
  <desc id="linked-desc">An application architect creates named normal Conduits in one dynamic frame and selects policies. Runtime operators link peers, borrow provider lineages through contracts, auto-share roots through clusters, transfer ownership, sever relationships, and inspect topology. Application workloads trigger lazy revalidation on the next meld. Links remain same-frame only and structural mutations are scope-admitted.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#172033" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L12 6 L0 12z" fill="#40536d"/></marker>
    <style>
      .canvas{fill:#f8fafc}.title{font:700 34px "Segoe UI",Arial,sans-serif;fill:#10213d}.subtitle{font:400 18px "Segoe UI",Arial,sans-serif;fill:#52627a}.eyebrow{font:700 14px "Segoe UI",Arial,sans-serif;letter-spacing:1.6px;fill:#7552a3}.boundary{fill:#fff;stroke:#7552a3;stroke-width:3}.boundary-title{font:700 18px "Segoe UI",Arial,sans-serif;fill:#35214f}
      .actor{fill:#fff3d6;stroke:#9a6700;stroke-width:2.5}.definition{fill:#e8f0ff;stroke:#315a99;stroke-width:2.5}.execution{fill:#eaf7ef;stroke:#3f7a56;stroke-width:2.5}.governance{fill:#f4eaff;stroke:#7552a3;stroke-width:2.5}.constraint{fill:#fff0e8;stroke:#a4552a;stroke-width:2.5}.node-title{font:700 16px "Segoe UI",Arial,sans-serif;fill:#172033}.node-body{font:400 12.5px "Segoe UI",Arial,sans-serif;fill:#42526a}.actor-title{font:700 18px "Segoe UI",Arial,sans-serif;fill:#172033}.edge{fill:none;stroke:#40536d;stroke-width:2.7;marker-end:url(#arrow)}.relation{fill:none;stroke:#64748b;stroke-width:2.2;stroke-dasharray:8 6;marker-end:url(#arrow)}.footer{font:400 13px "Segoe UI",Arial,sans-serif;fill:#64748b}
    </style>
  </defs>
  <rect class="canvas" width="1600" height="1040"/>
  <text class="eyebrow" x="70" y="58">ENGINEERING DRAWINGS · USE CASE</text><text class="title" x="70" y="104">Compose independently owned subsystems without rebuilding the process</text><text class="subtitle" x="70" y="137">Dynamic Conduits share only through explicit contracts, clusters, permissions, and mediated ownership changes.</text>
  <rect class="boundary" x="300" y="170" width="1000" height="760" rx="28"/><rect x="336" y="154" width="390" height="34" rx="8" fill="#fff"/><text class="boundary-title" x="352" y="178">One dynamic AethericFrame · linked subsystems</text>

  <rect class="actor" x="48" y="230" width="205" height="125" rx="18" filter="url(#shadow)"/><circle cx="92" cy="272" r="18" fill="#fff" stroke="#9a6700" stroke-width="2"/><path d="M66 332 Q92 300 118 332" fill="#fff" stroke="#9a6700" stroke-width="2"/><text class="actor-title" x="180" y="279" text-anchor="middle">Architect</text><text class="node-body" x="177" y="310" text-anchor="middle">creates roots + policy</text>
  <rect class="actor" x="48" y="560" width="205" height="125" rx="18" filter="url(#shadow)"/><path d="M70 606 h34 l12 16 -12 16 H70 l-12-16z" fill="#fff" stroke="#9a6700" stroke-width="2"/><text class="actor-title" x="180" y="609" text-anchor="middle">Operator / agent</text><text class="node-body" x="177" y="640" text-anchor="middle">changes topology</text>
  <rect class="actor" x="1347" y="560" width="205" height="125" rx="18" filter="url(#shadow)"/><rect x="1370" y="600" width="48" height="38" rx="6" fill="#fff" stroke="#9a6700" stroke-width="2"/><text class="actor-title" x="1482" y="609" text-anchor="middle">Workload</text><text class="node-body" x="1462" y="640" text-anchor="middle">melds affected roots</text>

  <ellipse class="definition" cx="500" cy="275" rx="145" ry="64" filter="url(#shadow)"/><text class="node-title" x="500" y="268" text-anchor="middle">Conjure named roots</text><text class="node-body" x="500" y="294" text-anchor="middle">normal Conduits</text>
  <ellipse class="definition" cx="500" cy="455" rx="145" ry="64" filter="url(#shadow)"/><text class="node-title" x="500" y="448" text-anchor="middle">Apply policy</text><text class="node-body" x="500" y="474" text-anchor="middle">Policies + Permissions</text>
  <ellipse class="execution" cx="800" cy="275" rx="130" ry="60" filter="url(#shadow)"/><text class="node-title" x="800" y="268" text-anchor="middle">Link peer Conduits</text><text class="node-body" x="800" y="294" text-anchor="middle">scope-admitted mutation</text>
  <ellipse class="execution" cx="1110" cy="290" rx="140" ry="66" filter="url(#shadow)"/><text class="node-title" x="1110" y="278" text-anchor="middle">Borrow provider lineages</text><text class="node-body" x="1110" y="304" text-anchor="middle">directional contracts</text><text class="node-body" x="1110" y="327" text-anchor="middle">permissioned visibility</text>
  <ellipse class="execution" cx="800" cy="470" rx="130" ry="64" filter="url(#shadow)"/><text class="node-title" x="800" y="458" text-anchor="middle">Auto-share roots</text><text class="node-body" x="800" y="484" text-anchor="middle">ConduitCluster</text><text class="node-body" x="800" y="507" text-anchor="middle">cluster-scoped contracts</text>
  <ellipse class="governance" cx="1110" cy="470" rx="140" ry="60" filter="url(#shadow)"/><text class="node-title" x="1110" y="463" text-anchor="middle">Transfer ownership</text><text class="node-body" x="1110" y="489" text-anchor="middle">preflight + gated move</text>
  <ellipse class="governance" cx="800" cy="665" rx="130" ry="60" filter="url(#shadow)"/><text class="node-title" x="800" y="658" text-anchor="middle">Sever relationship</text><text class="node-body" x="800" y="684" text-anchor="middle">remove contract both sides</text>
  <ellipse class="execution" cx="1110" cy="665" rx="140" ry="66" filter="url(#shadow)"/><text class="node-title" x="1110" y="653" text-anchor="middle">Lazy revalidation</text><text class="node-body" x="1110" y="679" text-anchor="middle">affected roots gated</text><text class="node-body" x="1110" y="702" text-anchor="middle">next meld recompiles</text>
  <ellipse class="governance" cx="500" cy="665" rx="145" ry="68" filter="url(#shadow)"/><text class="node-title" x="500" y="651" text-anchor="middle">Manage + inspect topology</text><text class="node-body" x="500" y="677" text-anchor="middle">links · clusters · ownership</text><text class="node-body" x="500" y="700" text-anchor="middle">one operator entry point</text>
  <rect class="constraint" x="475" y="815" width="650" height="66" rx="15"/><text class="node-title" x="800" y="841" text-anchor="middle">Hard boundary · dynamic posture · normal Conduits · same frame</text><text class="node-body" x="800" y="866" text-anchor="middle">Cross-frame peer links refuse; disjoint admitted scope sets can still proceed concurrently.</text>

  <path class="edge" d="M253 270 H355"/><path class="edge" d="M253 305 H310 V455 H355"/><path class="edge" d="M253 622 H355"/><path class="edge" d="M1347 620 H1250"/>
  <path class="relation" d="M645 275 H670"/><path class="relation" d="M645 455 H655 V315 H800"/><path class="relation" d="M930 275 H970"/><path class="relation" d="M930 470 H950 V356 H1010"/><path class="relation" d="M645 645 H670 V470"/><path class="relation" d="M645 665 H670"/><path class="relation" d="M1110 356 V410"/><path class="relation" d="M1110 530 V599"/><path class="relation" d="M930 665 H970"/><path class="relation" d="M800 815 V725"/>
  <text class="footer" x="70" y="985">The graph stays modular because sharing is an explicit runtime relationship, never an accidental global lookup.</text><text class="footer" x="1530" y="985" text-anchor="end">Authored static view · not source-generated</text>
</svg>
