<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="worlds-title worlds-desc">
  <title id="worlds-title">Isolated runtime world use cases</title>
  <desc id="worlds-desc">One host process owns Aether and lazily creates named AethericFrames. Each frame owns its posture, registries, DevOps control plane, Conduits, and frame-unique objects. Independent workloads resolve inside their assigned frames. Operators attach a Rift or restore a formation into one target frame and can clean one frame without collapsing its siblings. Peer Conduit links remain same-frame only.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#172033" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L12 6 L0 12z" fill="#40536d"/></marker>
    <style>
      .canvas{fill:#f8fafc}.title{font:700 34px "Segoe UI",Arial,sans-serif;fill:#10213d}.subtitle{font:400 18px "Segoe UI",Arial,sans-serif;fill:#52627a}.eyebrow{font:700 14px "Segoe UI",Arial,sans-serif;letter-spacing:1.6px;fill:#287a88}.boundary{fill:#fff;stroke:#287a88;stroke-width:3}.boundary-title{font:700 18px "Segoe UI",Arial,sans-serif;fill:#123b43}
      .actor{fill:#fff3d6;stroke:#9a6700;stroke-width:2.5}.definition{fill:#e8f0ff;stroke:#315a99;stroke-width:2.5}.execution{fill:#eaf7ef;stroke:#3f7a56;stroke-width:2.5}.access{fill:#e7f7fa;stroke:#287a88;stroke-width:2.5}.frame{fill:#f5fbf7;stroke:#3f7a56;stroke-width:2.5;stroke-dasharray:8 5}.constraint{fill:#fff0e8;stroke:#a4552a;stroke-width:2.5}.node-title{font:700 16px "Segoe UI",Arial,sans-serif;fill:#172033}.node-body{font:400 12.5px "Segoe UI",Arial,sans-serif;fill:#42526a}.actor-title{font:700 18px "Segoe UI",Arial,sans-serif;fill:#172033}.edge{fill:none;stroke:#40536d;stroke-width:2.7;marker-end:url(#arrow)}.relation{fill:none;stroke:#64748b;stroke-width:2.2;stroke-dasharray:8 6;marker-end:url(#arrow)}.footer{font:400 13px "Segoe UI",Arial,sans-serif;fill:#64748b}
    </style>
  </defs>
  <rect class="canvas" width="1600" height="1040"/>
  <text class="eyebrow" x="70" y="58">ENGINEERING DRAWINGS · USE CASE</text><text class="title" x="70" y="104">Run multiple object worlds in one process without merging their authority</text><text class="subtitle" x="70" y="137">Aether owns the process; each named frame owns its own posture, control plane, registries, scopes, and frame-unique objects.</text>
  <rect class="boundary" x="300" y="170" width="1000" height="760" rx="28"/><rect x="336" y="154" width="330" height="34" rx="8" fill="#fff"/><text class="boundary-title" x="352" y="178">One Python process · one Aether owner</text>

  <rect class="actor" x="48" y="230" width="205" height="125" rx="18" filter="url(#shadow)"/><circle cx="92" cy="272" r="18" fill="#fff" stroke="#9a6700" stroke-width="2"/><path d="M66 332 Q92 300 118 332" fill="#fff" stroke="#9a6700" stroke-width="2"/><text class="actor-title" x="180" y="279" text-anchor="middle">Host application</text><text class="node-body" x="177" y="310" text-anchor="middle">names runtime worlds</text>
  <rect class="actor" x="48" y="560" width="205" height="125" rx="18" filter="url(#shadow)"/><rect x="70" y="600" width="48" height="38" rx="6" fill="#fff" stroke="#9a6700" stroke-width="2"/><text class="actor-title" x="182" y="609" text-anchor="middle">Workloads</text><text class="node-body" x="177" y="640" text-anchor="middle">resolve independently</text>
  <rect class="actor" x="1347" y="560" width="205" height="125" rx="18" filter="url(#shadow)"/><path d="M1372 606 h34 l12 16 -12 16 h-34 l-12-16z" fill="#fff" stroke="#9a6700" stroke-width="2"/><text class="actor-title" x="1480" y="609" text-anchor="middle">Operator / tool</text><text class="node-body" x="1462" y="640" text-anchor="middle">attaches or restores</text>

  <ellipse class="definition" cx="500" cy="270" rx="145" ry="64" filter="url(#shadow)"/><text class="node-title" x="500" y="263" text-anchor="middle">Lazily create named frames</text><text class="node-body" x="500" y="289" text-anchor="middle">no frame exists at import</text>
  <ellipse class="definition" cx="800" cy="270" rx="145" ry="64" filter="url(#shadow)"/><text class="node-title" x="800" y="263" text-anchor="middle">Bind frame posture</text><text class="node-body" x="800" y="289" text-anchor="middle">before Spellbooks conjure</text>
  <ellipse class="definition" cx="1100" cy="270" rx="145" ry="64" filter="url(#shadow)"/><text class="node-title" x="1100" y="263" text-anchor="middle">Isolate owned state</text><text class="node-body" x="1100" y="289" text-anchor="middle">registries · DevOps · Conduits</text>

  <rect class="frame" x="405" y="390" width="350" height="230" rx="22" filter="url(#shadow)"/><text class="node-title" x="580" y="424" text-anchor="middle">Frame A · workload world</text><rect class="execution" x="445" y="455" width="270" height="60" rx="13"/><text class="node-title" x="580" y="481" text-anchor="middle">Own control plane + Conduits</text><text class="node-body" x="580" y="504" text-anchor="middle">frame-local registries and validity</text><rect class="execution" x="445" y="535" width="270" height="60" rx="13"/><text class="node-title" x="580" y="561" text-anchor="middle">Frame-unique objects</text><text class="node-body" x="580" y="584" text-anchor="middle">not shared with sibling frames</text>
  <rect class="frame" x="845" y="390" width="350" height="230" rx="22" filter="url(#shadow)"/><text class="node-title" x="1020" y="424" text-anchor="middle">Frame B · workload world</text><rect class="execution" x="885" y="455" width="270" height="60" rx="13"/><text class="node-title" x="1020" y="481" text-anchor="middle">Own control plane + Conduits</text><text class="node-body" x="1020" y="504" text-anchor="middle">independent change-control state</text><rect class="execution" x="885" y="535" width="270" height="60" rx="13"/><text class="node-title" x="1020" y="561" text-anchor="middle">Frame-unique objects</text><text class="node-body" x="1020" y="584" text-anchor="middle">same spell can resolve separately</text>

  <ellipse class="execution" cx="580" cy="690" rx="145" ry="58" filter="url(#shadow)"/><text class="node-title" x="580" y="683" text-anchor="middle">Resolve inside assigned frame</text><text class="node-body" x="580" y="709" text-anchor="middle">one workload · one frame context</text>
  <ellipse class="access" cx="1020" cy="690" rx="145" ry="58" filter="url(#shadow)"/><text class="node-title" x="1020" y="683" text-anchor="middle">Operate one named frame</text><text class="node-body" x="1020" y="709" text-anchor="middle">explicit target · policy checked</text>
  <rect class="access" x="390" y="785" width="220" height="58" rx="14"/><text class="node-title" x="500" y="810" text-anchor="middle">Attach an eligible Rift</text><text class="node-body" x="500" y="832" text-anchor="middle">frame link + ACL</text>
  <rect class="access" x="690" y="785" width="220" height="58" rx="14"/><text class="node-title" x="800" y="810" text-anchor="middle">Restore one formation</text><text class="node-body" x="800" y="832" text-anchor="middle">retarget frame slice</text>
  <rect class="execution" x="990" y="785" width="220" height="58" rx="14"/><text class="node-title" x="1100" y="810" text-anchor="middle">Clean one frame</text><text class="node-body" x="1100" y="832" text-anchor="middle">siblings remain live</text>
  <rect class="constraint" x="475" y="870" width="650" height="42" rx="12"/><text class="node-title" x="800" y="887" text-anchor="middle">Isolation law · unique is per frame · peer Conduit links are same-frame only</text><text class="node-body" x="800" y="906" text-anchor="middle">Shared coordination never merges frame-owned object or control state.</text>

  <path class="edge" d="M253 270 H355"/><path class="edge" d="M253 620 H320 V690 H435"/><path class="edge" d="M1347 620 H1280 V690 H1165"/>
  <path class="relation" d="M645 270 H655"/><path class="relation" d="M945 270 H955"/><path class="relation" d="M1100 334 V365 H580 V390"/><path class="relation" d="M1100 334 V390"/>
  <path class="relation" d="M520 632 V620"/><path class="relation" d="M640 632 V620 H1020"/><path class="relation" d="M1020 748 V765 H500 V785"/><path class="relation" d="M1020 748 V765 H800 V785"/><path class="relation" d="M1020 748 V785"/>
  <text class="footer" x="70" y="985">Frames isolate runtime truth inside one process; mediated access names the frame it enters rather than assuming a global default.</text><text class="footer" x="1530" y="985" text-anchor="end">Authored static view · not source-generated</text>
</svg>
