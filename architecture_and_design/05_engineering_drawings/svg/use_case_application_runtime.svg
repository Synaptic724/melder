<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980"
     viewBox="0 0 1600 980" role="img"
     aria-labelledby="app-uc-title app-uc-desc">
  <title id="app-uc-title">Application runtime use cases</title>
  <desc id="app-uc-desc">
    Developers register, configure, conjure, and optionally link the object world.
    Application code resolves objects and opens narrower scopes. Operators inspect and
    clean the runtime.
  </desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6"
            orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#40536d"/>
    </marker>
    <style>
      .canvas{fill:#f8fafc}.title{font:700 34px "Segoe UI",Arial,sans-serif;fill:#10213d}
      .subtitle{font:400 18px "Segoe UI",Arial,sans-serif;fill:#52627a}
      .eyebrow{font:700 14px "Segoe UI",Arial,sans-serif;letter-spacing:1.6px;fill:#315a99}
      .boundary{fill:#fff;stroke:#315a99;stroke-width:3}.boundary-title{font:700 18px "Segoe UI",Arial,sans-serif;fill:#23344d}
      .actor{fill:#fff3d6;stroke:#9a6700;stroke-width:2.5}.definition{fill:#e8f0ff;stroke:#315a99;stroke-width:2.5}
      .execution{fill:#eaf7ef;stroke:#3f7a56;stroke-width:2.5}.governance{fill:#f4eaff;stroke:#7552a3;stroke-width:2.5}
      .node-title{font:700 18px "Segoe UI",Arial,sans-serif;fill:#172033}.node-body{font:400 13px "Segoe UI",Arial,sans-serif;fill:#42526a}
      .actor-title{font:700 19px "Segoe UI",Arial,sans-serif;fill:#172033}.edge{fill:none;stroke:#40536d;stroke-width:2.8;marker-end:url(#arrow)}
      .relation{fill:none;stroke:#64748b;stroke-width:2.4;stroke-dasharray:8 6;marker-end:url(#arrow)}
      .edge-label{font:600 12px "Segoe UI",Arial,sans-serif;fill:#34445b}.label-bg{fill:#fff;opacity:.96}
      .footer{font:400 13px "Segoe UI",Arial,sans-serif;fill:#64748b}
    </style>
  </defs>
  <rect class="canvas" width="1600" height="980"/>
  <text class="eyebrow" x="70" y="58">ENGINEERING DRAWINGS · USE CASE</text>
  <text class="title" x="70" y="104">How an application uses Melder</text>
  <text class="subtitle" x="70" y="137">Definition, activation, scoped work, dynamic composition, inspection, and teardown.</text>

  <rect class="boundary" x="300" y="178" width="1000" height="700" rx="28"/>
  <rect x="336" y="162" width="322" height="34" rx="8" fill="#fff"/>
  <text class="boundary-title" x="352" y="186">Melder dependency graph runtime</text>

  <rect class="actor" x="54" y="245" width="190" height="120" rx="18" filter="url(#shadow)"/>
  <circle cx="96" cy="285" r="18" fill="#fff" stroke="#9a6700" stroke-width="2"/>
  <path d="M 70 343 Q 96 311 122 343" fill="#fff" stroke="#9a6700" stroke-width="2"/>
  <text class="actor-title" x="174" y="292" text-anchor="middle">Developer</text>
  <text class="node-body" x="174" y="322" text-anchor="middle">defines the world</text>

  <rect class="actor" x="54" y="500" width="190" height="120" rx="18" filter="url(#shadow)"/>
  <rect x="77" y="532" width="48" height="40" rx="7" fill="#fff" stroke="#9a6700" stroke-width="2"/>
  <path d="M 87 543 h28 M87 553 h22 M87 563 h26" stroke="#9a6700" stroke-width="2"/>
  <text class="actor-title" x="185" y="545" text-anchor="middle">Application</text>
  <text class="node-body" x="185" y="576" text-anchor="middle">does scoped work</text>

  <rect class="actor" x="1350" y="380" width="190" height="120" rx="18" filter="url(#shadow)"/>
  <circle cx="1392" cy="420" r="18" fill="#fff" stroke="#9a6700" stroke-width="2"/>
  <path d="M 1366 478 Q 1392 446 1418 478" fill="#fff" stroke="#9a6700" stroke-width="2"/>
  <text class="actor-title" x="1470" y="427" text-anchor="middle">Operator</text>
  <text class="node-body" x="1464" y="458" text-anchor="middle">observes + tears down</text>

  <ellipse class="definition" cx="500" cy="290" rx="150" ry="72" filter="url(#shadow)"/>
  <text class="node-title" x="500" y="280" text-anchor="middle">Register definitions</text>
  <text class="node-body" x="500" y="307" text-anchor="middle">bind · scan · inactive stage</text>

  <ellipse class="definition" cx="500" cy="490" rx="150" ry="72" filter="url(#shadow)"/>
  <text class="node-title" x="500" y="480" text-anchor="middle">Configure policy</text>
  <text class="node-body" x="500" y="507" text-anchor="middle">lifetimes · hooks · posture</text>

  <ellipse class="definition" cx="800" cy="350" rx="150" ry="76" filter="url(#shadow)"/>
  <text class="node-title" x="800" y="338" text-anchor="middle">Conjure root graph</text>
  <text class="node-body" x="800" y="365" text-anchor="middle">compile + validate phases 1–11</text>

  <ellipse class="execution" cx="1085" cy="290" rx="150" ry="72" filter="url(#shadow)"/>
  <text class="node-title" x="1085" y="280" text-anchor="middle">Resolve object</text>
  <text class="node-body" x="1085" y="307" text-anchor="middle">meld + gates + lifetime routing</text>

  <ellipse class="execution" cx="1085" cy="490" rx="150" ry="72" filter="url(#shadow)"/>
  <text class="node-title" x="1085" y="480" text-anchor="middle">Open work scope</text>
  <text class="node-body" x="1085" y="507" text-anchor="middle">lesser conduit · SpellSpace</text>

  <ellipse class="execution" cx="520" cy="710" rx="155" ry="72" filter="url(#shadow)"/>
  <text class="node-title" x="520" y="700" text-anchor="middle">Link subsystems</text>
  <text class="node-body" x="520" y="727" text-anchor="middle">link · contract · sever (dynamic)</text>

  <ellipse class="governance" cx="825" cy="710" rx="145" ry="72" filter="url(#shadow)"/>
  <text class="node-title" x="825" y="700" text-anchor="middle">Inspect status</text>
  <text class="node-body" x="825" y="727" text-anchor="middle">graph · validity · live objects</text>

  <ellipse class="governance" cx="1110" cy="710" rx="150" ry="72" filter="url(#shadow)"/>
  <text class="node-title" x="1110" y="700" text-anchor="middle">Clean up world</text>
  <text class="node-body" x="1110" y="727" text-anchor="middle">narrow scopes before owners</text>

  <path class="edge" d="M 244 280 H 350"/><path class="edge" d="M 244 315 H 330 V 490 H 350"/>
  <path class="edge" d="M 244 550 H 870 V 290 H 935"/><path class="edge" d="M 244 590 H 900 V 490 H 935"/>
  <path class="edge" d="M 1350 420 H 1280 V 710 H 970"/><path class="edge" d="M 1350 460 H 1290 V 710 H 1260"/>
  <path class="edge" d="M 244 335 H 275 V 710 H 365"/>
  <path class="relation" d="M 650 290 H 690 V 320"/><path class="relation" d="M 650 490 H 690 V 390"/>
  <path class="relation" d="M 950 350 H 980 V 290 H 935"/><path class="relation" d="M 1085 362 V 418"/>
  <rect class="label-bg" x="660" y="276" width="76" height="22" rx="5"/><text class="edge-label" x="698" y="292" text-anchor="middle">requires</text>
  <rect class="label-bg" x="982" y="376" width="84" height="22" rx="5"/><text class="edge-label" x="1024" y="392" text-anchor="middle">may enter</text>
  <text class="footer" x="70" y="930">Actor associations are solid. Dashed arrows show required or optional use-case relationships.</text>
  <text class="footer" x="1530" y="930" text-anchor="end">Authored static view · not source-generated</text>
</svg>
