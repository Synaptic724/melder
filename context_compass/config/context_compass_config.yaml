version: 1

profiles:
  active_profile: default_general
  available_profiles:
    - default_general

workflow:
  ticket_microcycle:
    enabled: true
    mode: strict
    require_note_before_continue: true
    minimum_note_score: 7
    expansion_gate_max_files: 5
    unknown_default: true

codex:
  viewer_tool_read_limit: 500 # This is the current limit for codex reading tool


# Commentary on the configuration file
# This file contains settings for the Context Compass application, including profiles, workflow configurations, and Codex settings.
# Profiles define different user contexts or roles within the application.
# Workflow configurations control how tasks are managed and executed within the application.
# Codex settings specify parameters for the Codex tool, which is used for code analysis and understanding.