# context_compass_config.yaml
#
# NOTE:
# - This config is a policy-routing + thresholds file.
# - Adjust values to your environment/platform.
# - Primary objective for compaction is fidelity of system/skills/policy state.

profiles:
  # The currently selected operating role/profile (e.g., "engineer", "general", "user_defined/<name>").
  active_profile: null

  onboarding:
    # When true, first-time onboarding may start in the `new` profile and then switch to a steady-state role.
    first_time_enabled: false

  roles_map:
    new: agent_onboarding/default/new/SKILLS.MD
    general: agent_onboarding/default/general/SKILLS.MD
    engineer: agent_onboarding/default/engineer/SKILLS.MD

codex:
  # Max LOC permitted per single "read" operation before chunking is required.
  read_loc_max: 500
  # Max lines per viewer-tool read chunk (when chunking is required).
  viewer_tool_read_limit: 500

compaction:
  # Optimization target:
  # - "maximize_platform_limit": use as much compaction summary budget as the platform allows.
  # - compactness is a constraint, not the objective.
  summary_budget_mode: maximize_platform_limit

  # Target domain weighting for the compaction summary:
  domain_weights:
    system_skill: 0.90
    operational: 0.10

  # Trimming is allowed ONLY when the platform enforces a hard limit.
  # Trimming order MUST protect system/skills/policy coverage first.
  trimming:
    order:
      - operational_detail
      - operational_pointers_noncritical
      - system_skill_P2
      - system_skill_P1
      - system_skill_P0_policy_gates_never_trim

compaction_diff_onboarding:
  # Gates evaluate compaction quality; they do NOT relax onboarding scope.
  gates:
    system_skill_doc_coverage_min: 0.95
    system_skill_parity_rate_min: 0.98
    policy_gate_miss_max: 0
    consecutive_cycles_required: 2

  board:
    max_rows_per_cycle: 250
    max_open_items: 1000

knowledge_gate:
  # Knowledge gate is mandatory after compaction/handoff before recertification.
  # It measures competence at applying system/skills/policy rules, not just recall.
  initial_state: unrated

  # Pass thresholds (0-100 scale)
  pass_threshold: 85
  global_pass_threshold: 90
  p0_critical_miss_max: 0
  consecutive_pass_cycles_required: 2

  # Question volume by doc size (per-doc)
  question_counts:
    small: 8
    medium: 12
    large: 16

  # Mix targets for each generated test set (fractions)
  format_mix:
    mcq: 0.70
    short: 0.20
    scenario: 0.10

  priority_mix:
    p0: 0.50
    p1: 0.35
    p2: 0.15

  # Test quality gate (score out of 100)
  test_quality_threshold: 85

  # Domain weighting (used when shrinking cycle test volume)
  domain_weighting:
    system_skill: 0.90
    operational: 0.10

  # Sentinel behavior (never removed)
  sentinel:
    p0_min_questions_per_doc: 3
    always_include_p0_docs: true
    stable_streak_for_shrink: 3

  # Regeneration behavior
  regeneration:
    min_new_question_ratio: 0.40

  # Anti-cheat (strict)
  anti_cheat:
    answers_locked_until_submission: true

  # Scoring weights
  scoring:
    per_skill_weights:
      p0: 0.70
      p1: 0.20
      p2: 0.10
    global_weights:
      knowledge: 0.60
      fidelity: 0.40

  # Artifact locations (relative to context_compass/)
  artifacts:
    manifest_path: skill_check/manifest/onboarding_manifest.yaml
    tests_dir: skill_check/tests
    answers_dir: skill_check/test_answers
    historical_results_dir: skill_check/historical_test_results

workflow:
  ticket_microcycle:
    # If planned discovery exceeds this number of files, ask the user to confirm expansion.
    expansion_gate_max_files: 12
    # Notes with SCORE_0_TO_10 below this value are non-compliant.
    minimum_note_score: 6