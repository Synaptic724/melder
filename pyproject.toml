[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "melder"
dynamic = ["version"]
description = "AI-native dependency graph runtime for free-threaded Python: a live, inspectable object graph that agents can read, safely operate under compiled permissions, checkpoint, and evolve. Zero dependencies, 3.14+ no-GIL."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]

authors = [
    { name = "Mark Geleta", email = "SynapticAISystems@gmail.com" }
]

maintainers = [
    { name = "Mark Geleta", email = "SynapticAISystems@gmail.com" }
]

keywords = [
    "dependency injection",
    "DI container",
    "service container",
    "dependency management",
    "python di",
    "dependency injection container",
    "lightweight di",
    "scoped services",
    "singleton services",
    "service resolution",
    "free threading",
    "no-gil",
    "nogil",
    "free-threaded",
    "thread-safe",
    "concurrency",
    "dependency graph",
    "runtime",
    "ai-native",
    "ai agents",
    "agent runtime",
    "agentic",
    "llm tools",
    "codegen",
    "sandbox",
    "checkpoint",
    "hot reload",
    "introspection",
    "melder",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Object Brokering",
    "Environment :: Console",
    "Typing :: Typed",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/Synaptic724/melder"
Repository = "https://github.com/Synaptic724/melder"
Issues = "https://github.com/Synaptic724/melder/issues"
Documentation = "https://melder.readthedocs.io/en/latest/"
Changelog = "https://github.com/Synaptic724/melder/releases"
LinkedIn = "https://www.linkedin.com/in/mark-geleta-4b59b752/"

# PEP 735 dependency groups: development-only requirements that are NEVER
# published in any built distribution. Install with `pip install --group dev`
# (pip >= 25.1). Transitive pins (pluggy, iniconfig, execnet, mypy_extensions,
# typing_extensions, packaging, ...) are deliberately omitted - the resolver
# owns those.
[dependency-groups]
# Only pytest built-in markers are used suite-wide (parametrize, xfail, skip);
# test tiers are split by directory, not marker. pytest-mock/-timeout/
# -rerunfailures were dropped as never exercised (suite uses unittest.mock).
test = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "coverage>=7.15.0",
]

lint = [
    "ruff>=0.15.15",
]
# Opt-in: parallel test execution (`pytest -n auto`).
parallel = [
    "pytest-xdist>=3.8.0",
]
# Opt-in: repo policy bans `type: ignore` and `Any` widening, which is only
# enforced if something type-checks. Install this group to enforce it.
typecheck = [
    "mypy>=2.1.0",
]
# Opt-in: imported lazily by context_compass/scripts/strip_*_codemod.py only.
codemod = [
    "libcst>=1.8.6",
]
build = [
    "setuptools>=83.0.0",
    "wheel>=0.47.0",
    "build>=1.2",
]
# Competing DI containers, imported ONLY by benchmarks/ for comparison runs.
# Never required to develop, test, or build melder itself.
benchmark = [
    "dependency-injector>=4.49.1",
    "dishka>=1.10.1",
    "injector>=0.24.0",
    "lagom>=2.7.7",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "build" },
]

[tool.setuptools]
package-dir = { "" = "src" }

# Single version truth: setuptools reads the plain literal in
# src/melder/__version__.py via static AST (no import at build time).
[tool.setuptools.dynamic]
version = { attr = "melder.__version__.__version__" }

# PEP 561: ship the py.typed marker so downstream type checkers consume
# melder's inline annotations instead of treating the package as Any.
#
# Nothing else needs listing. The build assets' committed truth is a plain `.py`
# manifest under `_build_assets/<asset>/manifest/`, which setuptools ships by
# virtue of it being a module. Their `.melc` caches are NOT packaged on purpose:
# marshal is interpreter-specific, so a bundle baked at build time would be read
# by whatever Python the wheel lands on. `_asset_cache` rebuilds it per
# interpreter on first import, and degrades to the manifest when the install
# directory is read-only.
[tool.setuptools.package-data]
melder = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["melder*"]
# EXPLICIT, not inherited from a default. The repo keeps exactly ONE `__init__.py`
# (the package root), so every subpackage - including the durable build asset at
# `melder/_build_assets/_bind_guard/` that `bind.py` imports at module scope -
# is a PEP 420 namespace package. Setting this here means wheel contents never
# depend on a setuptools default we would have to re-verify on every upgrade.
namespaces = true
exclude = [
    "tests*", "docs*", "examples*", "Plans*", "benchmarks*", "benchmark_data*",
    ".github*", ".venv*", "__pycache__", "*.egg-info", "TestIdeas",
    "context_compass*", "UX_and_AIX_experiences*",
    "build_scripts*", "performance_hunt*", "profiles*",
]

# The generated manifests are DURABLE build assets: committed, and they MUST ship
# in the wheel because `bind.py` imports the guard at module scope and there is no
# runtime rebuild lane. Nothing is excluded here - the previous
# exclude-package-data entry pointed at a path that no longer exists and was
# silently inert.


[tool.coverage.run]
source = ["src/melder"]
branch = true
omit = [
    "benchmarks/*",
    "Plans/*",
    "context_compass/*",
    "UX_and_AIX_experiences/*",
    "performance_hunt/*",
    "build_scripts/*",
    "*/_build_assets/_bind_guard/manifest/bind_guard_manifest.py",
]

[tool.coverage.report]
omit = [
    "benchmarks/*",
    "Plans/*",
    "context_compass/*",
    "UX_and_AIX_experiences/*",
    "performance_hunt/*",
    "build_scripts/*",
    "*/_build_assets/_bind_guard/manifest/bind_guard_manifest.py",
]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "benchmarks",
    "Plans",
    "context_compass",
    "UX_and_AIX_experiences",
    "performance_hunt",
    "profiles",
    "build_scripts",
    ".venv",
    ".venv_new",
    "__pycache__",
    "__melder_cache__",
]
markers = [
    "integration: integration tests that wire multiple real components together",
    "component: component tests over a small slice of real wiring, no external IO",
]

# Typing is a first-class contract in this repo: `type: ignore` and `Any`
# widening are disallowed by policy, so the checker is configured strictly.
[tool.mypy]
python_version = "3.14"
files = ["src/melder"]
strict = true
warn_unused_ignores = true
warn_unreachable = true
warn_redundant_casts = true
disallow_any_explicit = false
show_error_codes = true
pretty = true
exclude = [
    "^build_scripts/",
    # generated artifact; the loader/builder ARE type-checked
    "_build_assets/_bind_guard/manifest/bind_guard_manifest\\.py$",
]
