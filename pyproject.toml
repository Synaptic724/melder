[build-system]
requires = ["setuptools>=77.0", "wheel>=0.37"]
build-backend = "setuptools.build_meta"

[project]
name = "melder"
dynamic = ["version"]
description = "Lightweight, high-performance dependency injection container for Python 3.14+ applications."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

authors = [
    { name = "Mark Geleta", email = "SynapticAISystems@gmail.com" }
]

maintainers = [
    { name = "Mark Geleta", email = "SynapticAISystems@gmail.com" }
]

keywords = [
    "dependency injection",
    "DI container",
    "service container",
    "dependency management",
    "python di",
    "dependency injection container",
    "lightweight di",
    "scoped services",
    "singleton services",
    "service resolution",
    "melder",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Environment :: Console",
    "Typing :: Typed",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/Synaptic724/melder"
Repository = "https://github.com/Synaptic724/melder"
Issues = "https://github.com/Synaptic724/melder/issues"
Documentation = "https://github.com/Synaptic724/melder"
LinkedIn = "https://www.linkedin.com/in/mark-geleta-4b59b752/"

[tool.setuptools]
package-dir = { "" = "src" }

# Single version truth: setuptools reads the plain literal in
# src/melder/__version__.py via static AST (no import at build time).
[tool.setuptools.dynamic]
version = { attr = "melder.__version__.__version__" }

# PEP 561: ship the py.typed marker so downstream type checkers consume
# melder's inline annotations instead of treating the package as Any.
[tool.setuptools.package-data]
melder = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["melder*"]
exclude = [
    "tests*", "docs*", "examples*", "Plans*", "benchmarks*", "benchmark_data*",
    ".github*", ".venv*", "__pycache__", "*.egg-info", "TestIdeas"
]


[tool.coverage.run]
source = ["src/melder"]
omit = [
    "benchmarks/*",
    "Plans/*",
    "codex/*",
    "codex_agent_2/*",
    "codex_agent_3/*",
]

[tool.coverage.report]
omit = [
    "benchmarks/*",
    "Plans/*",
    "codex/*",
    "codex_agent_2/*",
    "codex_agent_3/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "benchmarks",
    "Plans",
    "codex",
    "codex_agent_2",
    "codex_agent_3",
    ".venv",
    ".venv_new",
    "__pycache__",
]
